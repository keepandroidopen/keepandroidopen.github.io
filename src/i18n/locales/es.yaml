hero_countdown_label: "días hasta el cierre"
# [en]hero_sub: "Starting September 2026, a silent update, nonconsensually pushed by Google, will **block every Android app** whose developer hasn't registered with Google, signed their contract, paid ..."
hero_sub: "Iniciando en el mes de septiembre de 2026, una actualización silenciosa, empujada por google sin el consentimiento de nadie, **bloqueará toda aplicación en Android** en la que su desarrollador/es no se hayan registrado con Google, firmado su contrato, pagado y entregado su documento de identidad del gobierno"
