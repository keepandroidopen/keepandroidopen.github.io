# What Google is doing
# [en]what_heading: "What Google is doing"
what-hading: "Lo que está haciendo Google"
# [en]what_intro: "In August 2025, Google [announced](https://developer.android.com/developer-verification) a new requirement: starting September 2026, **every Android app..."
what_intro: "En Agosto de 2025, Google [anunció](https://developer.android.com/developer-verification) un nuevo requerimiento: empezando en septiembre de 2026, **todo desarrollador de aplicaciones en Android deberá registrarse centralmente en Google** antes que su software pueda ser instalado en cualquier dispositivo. No sólo aplicaciones de la Play Store: todas. Esto incluye aplicaciones compartidas entre amigos, distribuídas a través de [F-Droid](https://f-droid.org/) o inclusive hechas por aficionados para uso personal. Desarrolladores independientes, grupos de iglesia y comunitarios, y aficionados por igual, serán bloqueados de desarrollar y distribuir su propio software."
# [en]what_registration: "Registration requires:"
what_registration: "El registro requiere: "
# [en]what_req_fee: "Paying a fee to Google"
what_req_fee: "Pagarle una suma de dinero a Google"
# [en]what_req_terms: "Agreeing to Google's Terms and Conditions"
what-req_terms: "Aceptar los Términos y Condiciones de Google"
# [en]what_req_id: "Surrendering your government-issued identification"
what-req_id: "Darles tu documento de identificación nacional"
# [en]what_req_signing: "Providing evidence of your private signing key"
what_req_signing: "Proporcionar evidencia de su clave de firma privada"
# [en]what_req_appids: "Listing all current and all future application identifiers"
what_req_appids: "Proporcionar todos los identificadores de todas las aplicaciones tanto actuales como futuras"
# [en]what_pullquote: "If a developer does not comply, their apps get silently blocked on every Android device worldwide."
what_pullquote: "Si un desarrollador no cumple, sus aplicaciones van a ser silenciosamente bloqueadas en todos los dispositivos Android en el mundo."

# Who this hurts
# [en]impact_heading: "Who this hurts"
impact_heading: "A quién afecta"
# [en]impact_you_heading: "You"
impact_you_heading: "Tú"
# [en]impact_you_p1: "You bought an Android phone because Google told you it was open. You could install what you wanted, and that was the deal."
impact_you_p1: "Compraste un teléfono Android porque google dijo que es abierto y libre. Podías instalar lo que querías y ese era el trato."
# [en]impact_you_p2: "Google is now rewriting that deal, retroactively, on hardware you already own. After the update lands, you can only run software that Google has pre-approved. On your phone: <i>your</i> property, t..."
impact_you_p2:"Google ahora está reescribiendo ese trato, retroactivamente, en el dispositivo que es de tu propiedad. Después de que la actualización suceda, tu sólamente podrás hacer funcionar software que Google haya aprovado previamente. En tú teléfono: <i>tú</i> propiedad, que <i>tú</i> pagaste."
# [en]impact_dev_heading: "Independent developers"
impact_dev_heading: "Desarrolladores independientes"
# [en]impact_dev_p1: "A teenager's first app, a volunteer's privacy tool, or a company's confidential internal beta. It doesn't matter. After September 2026, none of these can be installed without Google's blessing."
impact_dev_p1: "La priera aplicación de un estudiante adolescente, una herramienta de privacidad de un volutario, o el beta confidencial interno de una compañía. No importa. Después de septiembre de 2026, ninguna de estas aplicaciones podrá ser instalada sin la aprovación de Google."
# [en]impact_dev_p2: "<a href=\"https://f-droid.org\" target=\"_blank\">F-Droid</a>, home to thousands of free and open-source Android apps, has called this an <a href=\"https://f-droid.org/en/2025/09/29/google-..."
impact-dev-p2: "<a href=\"https://f-droid.org\" target=\"_blank\">F-Droid</a>, hogar de miles de aplicaciones gratis y de código abierto, llamó esto una <a href=\https://f-droid.org/en/2025/09/29/google-developer-registration-decree.html\" target=\"_blank\">amenaza \"existencial\"</a>. Cory Doctorow lo llamó <a href=\https://pluralistic.net/2025/09/01/fulu/\" target=\"_blank\">\"Dart Android\"."
# [en]impact_gov_heading: "Governments & civil society"
impact_gov_heading: "Gobiernos y la sociedad"
# [en]impact_gov_p1: "Google has a <a href=\"https://www.aclu.org/news/free-speech/app-store-oligopoly\" target=\"_blank\">documented track record</a> of complying when authoritarian regimes demand app removals...."
impact_gov_p1: "Google tiene un <a href=\"https://www.aclu.org/news/free-speech/app-store-oligopoly\" target=\"_blank\">historial documentado</a> de cumplir cuando un régimen autoritario demanda la eliminación de aplicaciones. Con este programa, el software que hace funcionar las intituciones de tu país existirán a placer de una sola corporación extranjera sin responsabilidades."
# [en]impact_gov_p2: "The <a href=\"https://www.eff.org/deeplinks/2025/11/application-gatekeeping-ever-expanding-pathway-internet-censorship\" target=\"_blank\">EFF calls</a> app gatekeeping \"an ever-expanding ..."
impact_gov_p2: "La <a href=\"https://www.eff.org/deeplinks/2025/11/application-gatekeeping-ever-expanding-pathway-internet-censorship\" target=\"_blank\">EFF llama</a> a estas restricciones \"un camino de constante expansión a la censura total de la internet\"."
# Advanced flow
# [en]flow_heading: "Google's \"escape hatch\" is a trap door"
flow_heading: "La \"escotilla de escape\" de Google es una trampa."
# [en]flow_intro: "Google says \"power users\" can [\"still install\"](https://android-developers.googleblog.com/2026/03/android-developer-verification.html) unverified apps. Here's wha..."
flow_intro: "Google dice que \"usuarios aficionados\" pueden [\"aún instalar\"](https://android-developers.googleblog.com/2026/03/android-developer-verification.html) aplicaciones sin verificar. Así es cómo se ve <i>realmente</i>:
# [en]flow_step1: "Delve into System Settings, find Developer Options"
flow_step1: "Entrar en Configuración de Sistema, encontrar Opciones para desarrolladores"
# [en]flow_step2: "Tap the build number <strong>seven times</strong> to enable Developer Mode"
flow_step2: "Tocar el número de compilación <strong>siete veces</strong> para activar el modo de Desarrollador"
# [en]flow_step3: "Dismiss scare screens about coercion"
flow_step3: "Descartar carteles alarmistas de coerción"
# [en]flow_step4: "Enter your PIN"
flow_step4: "Ingresar su PIN"
# [en]flow_step5: "Restart the device"
flow_step5: "Reiniciar el dispositivo"
# [en]flow_step6: "<strong>Wait 24 hours</strong>"
flow-step6: "<strong>WEspera 24 horas</strong>"
# [en]flow_step7: "Come back, dismiss more scare screens"
flow_step7: "Volver, descartar más carteles alarmistas"
# [en]flow_step8: "Pick \"allow temporarily\" (7 days) or \"allow indefinitely\""
flow-step8: "Elegir entre \"permitir temporalmente\" (7 días) o \"permitir indefinidamente\""
# [en]flow_step9: "Confirm, again, that you understand \"the risks\""
flow_step9: "Confirmar, otra vez, que entiendes \"los riesgos\""
# [en]flow_summary: "Nine steps. A mandatory 24-hour cooling-off period. *For installing software on a device you own.*"
flow-sumary: "Nueve pasos. Un período de espera de 24 horas. *Para instalar software en un dispositivo de tú propiedad.*"
# [en]flow_detail: "Worse: this flow runs entirely through **Google Play Services**, not the Android OS. Google can change it, tighten it, or kill it at any time, with no OS update required and no consent..."
flow-detail: "Peor aún: Este flujo se gestiona integramente a través de los **Servicios de Google Play**, no en el sistema operativo Android. Google puede modificarlo, restringirlo, o eliminarlo en cualquier momento, sin ninguna actualización y sin consentimiento alguno. Y, a día de hoy, no se ha incluido en ninguna versión beta, de vista previa ni canary. Solo existe en forma de entrada de blog y algunas maquetas."

# Precedent
# [en]precedent_heading: "This is bigger than Android"
precedent_heading: "Esto va más allá de Android"
# [en]precedent_pullquote: "If Google can retroactively lock down billions of devices that were sold as open platforms, every hardware manufacturer on the planet is watching."
precedent_pullquote: "Si Google puede bloquear retroactivamente miles de millones de dispositivos que fueron vendidos como plataformas abiertas, todos los fabricantes de hardware están observando."
# [en]precedent_p1: "The principle being established: <strong>the company that made your device gets to decide, after you've bought it, what software you're allowed to run.</strong> In software, this is called a \"rug ..."
precedent_p1: "El principio que se está imponiendo: <strong>la empresa que fabricó tu dispositivo es la que decide, una vez que lo has comprado, qué software puedes ejecutar.</strong> En el ámbito del software, a esto se le llama \"rug pull\"; pero al menos siempre podías instalar software de la competencia. En el ámbito del hardware, se trata de un <i>hecho consumado</i> que te priva de tu autonomía y te deja indefenso ante los caprichos de un único guardián que no rinde cuentas y que ha sido previamente declarado culpable de monopolio."
# [en]precedent_p2: "Android's openness was never just a feature. It was the <em>promise</em> that distinguished it from iPhone. Millions chose Android for exactly that reason. Google is now revoking that promise unila..."
precedent_p2: "La libertad de Android nunca fue una característica. Era una <em>promesa</em> que la distinguía de iPhone. Millones elijieron Android por esa razón. Google ahora está revocando esa promesa de manera unilateral en dispositivos que están en lo bolsillos de la gente porque decidió que cuenta con suficiente dominio en el mercado e influencia sobre reguladores como para salirse con la suya."
# [en]precedent_arstechnica: "[Ars Technica](https://arstechnica.com/gadgets/2026/03/with-developer-verification-googles-apple-envy-threatens-to-dismantle-androids-open-legacy/): *\"Goo..."
precedent_arstechnica: "[Ars Technica](https://arstechnica.com/gadgets/2026/03/with-developer-verification-googles-apple-envy-threatens-to-dismantle-androids-open-legacy/): *\"La envidia de Google hacia Apple amenaza con desmantelar el legado abierto de Android\".*"
