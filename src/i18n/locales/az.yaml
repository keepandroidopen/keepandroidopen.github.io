# [en] social_callout_linkedin_8: "Retroactively changing the rules for hardware people already own is a dangerous precedent. Google's mandatory developer verification strips users of their agency and forces them into a managed ecosystem. {url} #KeepAndroidOpen"
social_callout_linkedin_8: "İnsanların artıq sahib olduqları avadanlıq üçün qaydaların geriyə dönük şəkildə dəyişdirilməsi təhlükəli presedentdir. Google-un məcburi tərtibatçı yoxlaması istifadəçilərin öz cihazları üzərində qərar vermək hüququnu məhdudlaşdırır və onları idarə olunan ekosistemə məcbur edir. {url} #KeepAndroidOpen"
# [en] social_callout_linkedin_9: "F-Droid and the EFF have raised the alarm: Google's developer verification program is an 'existential threat' to alternative app distribution. We must protect the open-source ecosystem that built Android. {url} #KeepAndroidOpen"
social_callout_linkedin_9: "F-Droid və EFF həyəcan təbili çalır: Google-un tərtibatçıların yoxlanılması proqramı alternativ tətbiq yayımı üçün \"mövcudluq təhdidi\"dir. Android-i formalaşdıran açıq mənbə ekosistemini qorumalıyıq. {url} #KeepAndroidOpen"
# [en] social_callout_linkedin_10: "As Google moves to further entrench its gatekeeping status, the community is pushing back. Your device should be your property, not a leased terminal subject to retroactive restrictions. Join the movement: {url} #KeepAndroidOpen"
social_callout_linkedin_10: "Google özünün girişə nəzarət edən mövqeyini daha da möhkəmləndirməyə çalışdıqca, icma buna qarşı çıxır. Sizin cihazınız öz əmlakınız olmalıdır, geriyə dönük məhdudiyyətlərə tabe olan icarəyə götürülmüş terminal deyil. Hərəkata qoşulun: {url} #KeepAndroidOpen"

# [en] social_callout_bluesky_1: "Starting in 2027, Google will block any Android app whose developer hasn't registered and provided government ID. This affects all apps, not just Play Store apps. F-Droid calls it an \"existential threat.\" @keepandroidopen.bsky.social #KeepAndroidOpen {url}"
social_callout_bluesky_1: "2027-ci ildən Google qeydiyyatdan keçməyən və dövlət tərəfindən verilmiş şəxsiyyət sənədi təqdim etməyən tərtibatçıların Android tətbiqlərini bloklayacaq. Bu, bütün tətbiqlərə aiddir. F-Droid bunu \"mövcudluq təhdidi\" adlandırır. @keepandroidopen.bsky.social #KeepAndroidOpen {url}"
# [en] social_callout_bluesky_2: "Google is requiring all Android developers to register centrally, pay a fee, and submit government ID. Apps from unregistered developers will be silently blocked. over 67 organizations oppose this. @keepandroidopen.bsky.social {url}" 
social_callout_bluesky_2: "Google bütün Android tərtibatçılarından qeydiyyat, ödəniş və dövlət tərəfindən verilmiş şəxsiyyət sənədi tələb edir. Qeydiyyatsız tərtibatçıların tətbiqləri səssizcə bloklanacaq. 67+ təşkilat buna qarşıdır. @keepandroidopen.bsky.social {url}"
# [en] social_callout_bluesky_3: "After 17 years of marketing Android as an open platform, Google is mandating developer registration for all apps. Independent developers, open-source contributors, and alternative stores like F-Droid face an uncertain future. @keepandroidopen.bsky.social {url}" 
social_callout_bluesky_3: "Android-i 17 il açıq platforma kimi təqdim etdikdən sonra Google bütün tətbiqlər üçün tərtibatçı qeydiyyatını məcburi edir. Müstəqil tərtibatçılar, açıq mənbə töhfəçiləri və F-Droid kimi alternativ mağazalar qeyri-müəyyən gələcəklə üzləşir. @keepandroidopen.bsky.social {url}"
# [en] social_callout_bluesky_4: "Google's proposed workaround for installing unverified apps: 9 steps, a 24-hour wait, delivered through Play Services (which Google can change at any time without consent). It exists only as a blog post. @keepandroidopen.bsky.social #KeepAndroidOpen {url}" 
social_callout_bluesky_4: "Google-un yoxlanılmamış tətbiqlər üçün təklif etdiyi üsul: 9 addım, 24 saat gözləmə və Play Services. Google bunu istənilən vaxt razılıq olmadan dəyişə bilər. Hələ yalnız bloq yazısıdır. @keepandroidopen.bsky.social #KeepAndroidOpen {url}"
# [en] social_callout_bluesky_5: "The EFF warns that Google's developer verification creates \"a pathway to censorship.\" Developers in restrictive countries, anonymous open-source contributors, and privacy tool maintainers are among those most affected. @keepandroidopen.bsky.social {url}" 
social_callout_bluesky_5: "EFF xəbərdarlıq edir ki, Google-un tərtibatçı yoxlaması \"senzuraya aparan yol\" yaradır. Məhdud ölkələrdəki tərtibatçılar, anonim açıq mənbə töhfəçiləri və məxfilik alətlərinin müəllifləri ən çox təsirlənəcək. @keepandroidopen.bsky.social {url}"
# [en] social_callout_bluesky_6: "Google's plan to block unverified apps is a 'rug pull' on the 3 billion people who chose Android for its openness. Don't let them turn your phone into a walled garden. @keepandroidopen.bsky.social #KeepAndroidOpen {url}" 
social_callout_bluesky_6: "Google-un yoxlanılmamış tətbiqləri bloklamaq planı Android-i açıqlığına görə seçən 3 milyard insana qarşı \"rug pull\"dur. Telefonunuzu qapalı ekosistemə çevirmələrinə imkan verməyin. @keepandroidopen.bsky.social #KeepAndroidOpen {url}"
# [en] social_callout_bluesky_7: "Ownership means control. If Google can block any app on your phone, you don't really own it. Join the 100,000+ people fighting to keep Android open. @keepandroidopen.bsky.social {url}" 
social_callout_bluesky_7: "Sahiblik nəzarət deməkdir. Əgər Google telefonunuzdakı istənilən tətbiqi bloklaya bilirsə, deməli ona əslində sahib deyilsiniz. Android-i açıq saxlamaq üçün mübarizə aparan 100 000-dən çox insana qoşulun. @keepandroidopen.bsky.social {url}" 
# [en] social_callout_bluesky_8: "Mandatory ID registration for every app developer? This is a dream for censors and a nightmare for privacy. Protect the open web and open mobile. @keepandroidopen.bsky.social {url}" 
social_callout_bluesky_8: "Hər bir tətbiq tərtibatçısı üçün məcburi şəxsiyyət sənədi qeydiyyatı? Bu, senzura tərəfdarları üçün arzu, məxfilik üçün isə kabusdur. Açıq vebi və açıq mobil ekosistemi qoruyun. @keepandroidopen.bsky.social {url}" 
# [en] social_callout_bluesky_9: "Sideloading shouldn't require a 24-hour waiting period and a 9-step gauntlet. Google's 'advanced flow' is designed to fail. Keep Android Open! @keepandroidopen.bsky.social {url}" 
social_callout_bluesky_9: "Tətbiqləri kənardan quraşdırmaq üçün 24 saatlıq gözləmə müddəti və 9 addımlıq maneələr silsiləsi tələb olunmamalıdır. Google-un \"qabaqcıl prosedur\"u uğursuzluğa məhkum ediləcək şəkildə hazırlanıb. Android-i açıq saxlayın! @keepandroidopen.bsky.social {url}" 
# [en] social_callout_bluesky_10: "From F-Droid to independent devs, the entire Android ecosystem is under threat from Google's new mandatory registration decree. See why 67+ orgs are saying no: {url}" 
social_callout_bluesky_10: "F-Droid-dən müstəqil tərtibatçılara qədər bütün Android ekosistemi Google-un yeni məcburi qeydiyyat qərarının təhdidi altındadır. 67-dən çox təşkilatın niyə \"xeyr\" dediyini öyrənin: {url}"

# [en] social_callout_mastodon_1: "Starting in 2027, Google will require every Android app developer to register centrally, provide government ID, and submit signing key evidence. Apps from unregistered developers will be blocked on all certified devices worldwide. This threatens F-Droid, open-source distribution, and user autonomy. @keepandroidopen@techhub.social #KeepAndroidOpen {url}"
social_callout_mastodon_1: "2027-ci ildən etibarən Google bütün Android tətbiq tərtibatçılarından mərkəzləşdirilmiş qaydada qeydiyyatdan keçməyi, dövlət tərəfindən verilmiş şəxsiyyət sənədini və imzalama açarının sübutunu təqdim etməyi tələb edəcək. Qeydiyyatdan keçməmiş tərtibatçıların tətbiqləri dünya üzrə bütün sertifikatlaşdırılmış cihazlarda bloklanacaq. Bu, F-Droid, açıq mənbəli tətbiq yayımı və istifadəçi muxtariyyəti üçün təhlükə yaradır. @keepandroidopen@techhub.social #KeepAndroidOpen {url}"
# [en] social_callout_mastodon_2: "Google's Android Developer Verification program requires government ID, signing key evidence, and a fee for any developer who wants their software installable on Android. The EFF calls app gatekeeping \"a pathway to censorship.\" over 67 organizations have signed an open letter opposing it. @keepandroidopen@techhub.social #KeepAndroidOpen {url}"
social_callout_mastodon_2: "Google-un Android Tərtibatçılarının Yoxlanılması proqramı proqram təminatının Android-də quraşdırıla bilməsini istəyən istənilən tərtibatçıdan dövlət tərəfindən verilmiş şəxsiyyət sənədi, imzalama açarının sübutu və ödəniş tələb edir. EFF tətbiqlərə giriş üzərində nəzarəti \"senzuraya aparan yol\" adlandırır. 67-dən çox təşkilat buna qarşı açıq məktub imzalayıb. @keepandroidopen@techhub.social #KeepAndroidOpen {url}"
# [en] social_callout_mastodon_3: "F-Droid, home to thousands of free and open-source Android apps, calls Google's developer verification an \"existential threat.\" An estimated 85% of F-Droid apps could face distribution issues because their developers signed through F-Droid, not through Google. @keepandroidopen@techhub.social #KeepAndroidOpen {url}"
social_callout_mastodon_3: "Minlərlə pulsuz və açıq mənbəli Android tətbiqinə ev sahibliyi edən F-Droid Google-un tərtibatçıların yoxlanılması proqramını \"mövcudluq təhdidi\" adlandırır. Təxminlərə görə, F-Droid tətbiqlərinin 85%-i yayım problemləri ilə üzləşə bilər, çünki onların tərtibatçıları imzalama prosesini Google vasitəsilə deyil, F-Droid vasitəsilə həyata keçiriblər. @keepandroidopen@techhub.social #KeepAndroidOpen {url}"
# [en] social_callout_mastodon_4: "Google's proposed workaround for sideloading unverified apps requires 9 steps, a mandatory 24-hour waiting period, and is delivered through Google Play Services, not the Android OS. Google can modify or remove it at any time without user consent. It hasn't shipped in any beta. @keepandroidopen@techhub.social #KeepAndroidOpen {url}"
social_callout_mastodon_4: "Google-un yoxlanılmamış tətbiqləri kənardan quraşdırmaq üçün təklif etdiyi alternativ üsul 9 addım və məcburi 24 saatlıq gözləmə müddəti tələb edir və Android əməliyyat sistemi vasitəsilə deyil, Google Play Services üzərindən təqdim olunur. Google bunu istifadəçinin razılığı olmadan istənilən vaxt dəyişdirə və ya ləğv edə bilər. Bu funksiya heç bir beta versiyada təqdim edilməyib. @keepandroidopen@techhub.social #KeepAndroidOpen {url}"
# [en] social_callout_mastodon_5: "The mandatory developer registration Google is imposing on Android raises concerns for developers in sanctioned countries, anonymous open-source contributors, and anyone building privacy or security tools. Google has a documented history of complying with government demands to remove apps. @keepandroidopen@techhub.social #KeepAndroidOpen {url}"
social_callout_mastodon_5: "Google-un Android-də tətbiq etdiyi məcburi tərtibatçı qeydiyyatı sanksiyalara məruz qalan ölkələrdəki tərtibatçılar, anonim açıq mənbə töhfəçiləri və məxfilik və ya təhlükəsizlik alətləri yaradan hər kəs üçün narahatlıq doğurur. Google-un hökumətlərin tətbiqlərin silinməsi ilə bağlı tələblərinə əməl etməsi sənədləşdirilmiş keçmişə malikdir. @keepandroidopen@techhub.social #KeepAndroidOpen {url}"
# [en] social_callout_mastodon_6: "Android's strength was its decentralized nature. Google's plan to mandate central registration for every single app developer destroys that. We must resist this centralization of power. @keepandroidopen@techhub.social #KeepAndroidOpen {url}"
social_callout_mastodon_6: "Android-in gücü onun mərkəzləşdirilməmiş təbiətində idi. Google-un hər bir tətbiq tərtibatçısı üçün mərkəzləşdirilmiş qeydiyyatı məcburi etmək planı bunu məhv edir. Hakimiyyətin bu cür mərkəzləşdirilməsinə müqavimət göstərməliyik. @keepandroidopen@techhub.social #KeepAndroidOpen {url}"
# [en] social_callout_mastodon_7: "If you bought the hardware, you should have the final say on the software. Google's plan to block unverified apps is a direct attack on user sovereignty. {url} @keepandroidopen@techhub.social #KeepAndroidOpen"
social_callout_mastodon_7: "Avadanlığı siz almısınızsa, proqram təminatı barədə son söz də sizə aid olmalıdır. Google-un yoxlanılmamış tətbiqləri bloklamaq planı istifadəçi suverenliyinə birbaşa hücumdur. {url} @keepandroidopen@techhub.social #KeepAndroidOpen"
# [en] social_callout_mastodon_8: "Imagine a world where every small hobbyist or volunteer dev has to register with a global corporation just to share their work. That's the world Google is building for Android in 2027. {url} @keepandroidopen@techhub.social"
social_callout_mastodon_8: "Təsəvvür edin ki, öz işini paylaşmaq üçün hər bir kiçik həvəskar və ya könüllü tərtibatçı qlobal korporasiyada qeydiyyatdan keçməli olduğu bir dünya var. Google 2027-ci ildə Android üçün məhz belə bir dünya qurur. {url} @keepandroidopen@techhub.social"
# [en] social_callout_mastodon_9: "Google's 'advanced flow' for sideloading is a deterrence mechanism, not an escape hatch. 9 steps and a 24-hour wait for software you own? No thanks. @keepandroidopen@techhub.social #KeepAndroidOpen {url}"
social_callout_mastodon_9: "Google-un tətbiqləri kənardan quraşdırmaq üçün nəzərdə tutduğu \"qabaqcıl prosedur\" çıxış yolu deyil, çəkindirmə mexanizmidir. Sahib olduğunuz proqram təminatı üçün 9 addım və 24 saat gözləmək? Xeyr, sağ olun. @keepandroidopen@techhub.social #KeepAndroidOpen {url}"
# [en] social_callout_mastodon_10: "Over 100,000 people and 67+ organizations are standing up to Google's attempt to lock down Android. Join the fight for a truly open mobile ecosystem. {url} @keepandroidopen@techhub.social #KeepAndroidOpen"
social_callout_mastodon_10: "100 000-dən çox insan və 67-dən artıq təşkilat Google-un Android-i bağlamaq cəhdinə qarşı çıxır. Həqiqətən açıq mobil ekosistem uğrunda mübarizəyə qoşulun. {url} @keepandroidopen@techhub.social #KeepAndroidOpen"

# [en] social_callout_facebook_1: "Starting in 2027, Google will require every Android app developer to register centrally and provide government-issued identification. Apps from unregistered developers will be blocked on all certified Android devices worldwide. This applies to all apps, not just those on the Play Store. Learn more: {url}"
social_callout_facebook_1: "2027-ci ildən etibarən Google bütün Android tətbiq tərtibatçılarından mərkəzləşdirilmiş qaydada qeydiyyatdan keçməyi və dövlət tərəfindən verilmiş şəxsiyyət sənədini təqdim etməyi tələb edəcək. Qeydiyyatdan keçməmiş tərtibatçıların tətbiqləri dünya üzrə bütün sertifikatlaşdırılmış Android cihazlarında bloklanacaq. Bu, yalnız Play Store-dakı deyil, bütün tətbiqlərə aiddir. Ətraflı məlumat: {url}"
# [en] social_callout_facebook_2: "F-Droid, the open-source Android app store used by millions, calls Google's developer verification an \"existential threat\" to its continued operation. over 67 organizations including the EFF, FSF, and Tor Project have signed an open letter opposing the policy. Learn why this matters: {url}"
social_callout_facebook_2: "Milyonlarla insanın istifadə etdiyi açıq mənbəli Android tətbiq mağazası F-Droid Google-un tərtibatçıların yoxlanılması proqramını fəaliyyətini davam etdirməsi üçün \"mövcudluq təhdidi\" adlandırır. EFF, FSF və Tor Project də daxil olmaqla 67-dən çox təşkilat bu siyasətə qarşı açıq məktub imzalayıb. Bunun nə üçün vacib olduğunu öyrənin: {url}"
# [en] social_callout_facebook_3: "Google's proposed workaround for installing unverified apps after their lockdown takes effect requires 9 steps, a mandatory 24-hour waiting period, and runs through Google Play Services (which Google can modify at any time). The community is being asked to accept a blog post as a safeguard. {url}"
social_callout_facebook_3: "Bloklanma qüvvəyə mindikdən sonra yoxlanılmamış tətbiqləri quraşdırmaq üçün Google-un təklif etdiyi alternativ üsul 9 addım, məcburi 24 saatlıq gözləmə müddəti tələb edir və Google Play Services üzərindən işləyir (Google bunu istənilən vaxt dəyişə bilər). İcmadan qoruma mexanizmi kimi bir bloq yazısını qəbul etməsi istənilir. {url}"
# [en] social_callout_facebook_4: "Android's openness has been its defining characteristic for 17 years. Millions chose it over iPhone for exactly that reason. Google is now mandating developer registration for all apps, including those distributed outside the Play Store. Independent developers and open-source projects face the most impact. {url}"
social_callout_facebook_4: "Android-in açıqlığı 17 il ərzində onun əsas fərqləndirici xüsusiyyəti olub. Milyonlarla insan məhz bu səbəbdən onu iPhone əvəzinə seçib. İndi Google Play Store-dan kənarda yayılanlar da daxil olmaqla, bütün tətbiqlər üçün tərtibatçı qeydiyyatını məcburi edir. Bundan ən çox müstəqil tərtibatçılar və açıq mənbəli layihələr təsirlənəcək. {url}"
# [en] social_callout_facebook_5: "The EFF calls app gatekeeping \"a pathway to censorship.\" Google's developer verification would give a single company the ability to block any app, from any developer, on any certified device worldwide. This sets a precedent that extends beyond Android to the future of personal computing. {url}"
social_callout_facebook_5: "EFF tətbiqlərə girişə nəzarəti \"senzuraya aparan yol\" adlandırır. Google-un tərtibatçıların yoxlanılması proqramı tək bir şirkətə dünyanın istənilən yerində sertifikatlaşdırılmış istənilən cihazda istənilən tərtibatçının istənilən tətbiqini bloklamaq imkanı verəcək. Bu, Android-dən kənara çıxaraq fərdi hesablama texnologiyalarının gələcəyinə qədər uzanan bir presedent yaradır. {url}"
# social_callout_facebook_6: "Your phone, your choice? Not if Google has its way. Starting in 2027, they plan to block any app whose developer hasn't registered and provided government ID. This affects everyone. {url}"
social_callout_facebook_6: "Telefonunuz, seçiminiz? Google istədiyini həyata keçirə bilsə, belə olmayacaq. 2027-ci ildən etibarən onlar tərtibatçısı qeydiyyatdan keçməmiş və dövlət tərəfindən verilmiş şəxsiyyət sənədini təqdim etməmiş istənilən tətbiqi bloklamağı planlaşdırırlar. Bu, hər kəsə təsir edir. {url}"
# [en] social_callout_facebook_7: "Google is retroactively locking down billions of devices that were sold as open platforms. This 'rug pull' threatens independent developers and alternative app stores like F-Droid. {url}"
social_callout_facebook_7: "Google açıq platformalar kimi satılmış milyardlarla cihazı geriyə dönük şəkildə məhdudlaşdırır. Bu \"rug pull\" müstəqil tərtibatçıları və F-Droid kimi alternativ tətbiq mağazalarını təhdid edir. {url}"
# [en] social_callout_facebook_8: "Is your phone really yours? If Google can decide which apps you're allowed to install, the answer is no. Join the 100,000+ people fighting to keep Android open. {url}"
social_callout_facebook_8: "Telefonunuz həqiqətən sizə məxsusdur? Əgər Google hansı tətbiqləri quraşdıra biləcəyinizə qərar verə bilirsə, cavab xeyrdir. Android-i açıq saxlamaq üçün mübarizə aparan 100 000-dən çox insana qoşulun. {url}"
# [en] social_callout_facebook_9: "Google's 9-step process for 'allowing' unverified apps is a trap. It's designed to be so difficult that nobody uses it, giving Google total control. {url}"
social_callout_facebook_9: "Google-un yoxlanılmamış tətbiqlərə \"icazə vermək\" üçün nəzərdə tutduğu 9 addımlı proses tələdir. Bu proses elə çətin hazırlanıb ki, heç kim ondan istifadə etməsin və Google-a tam nəzarət versin. {url}"
# [en] social_callout_facebook_10: "From students building their first apps to volunteers creating privacy tools, Google's mandatory registration policy will freeze out innovation. Help us keep Android open! {url}"
social_callout_facebook_10: "İlk tətbiqlərini hazırlayan tələbələrdən məxfilik alətləri yaradan könüllülərə qədər, Google-un məcburi qeydiyyat siyasəti innovasiyanın qarşısını alacaq. Android-i açıq saxlamağımıza kömək edin! {url}"

