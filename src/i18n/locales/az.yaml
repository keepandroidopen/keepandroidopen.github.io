# [en] social_callout_linkedin_1: "Starting in 2027, Google will require every Android app developer to register centrally and provide government-issued identification before their software can be installed on any device. This applies to all apps, not just those on the Play Store. over 67 organizations have signed an open letter opposing the policy. {url} #KeepAndroidOpen" \
social_callout_linkedin_1: "2027-ci ildən etibarən Google bütün Android tətbiq tərtibatçılarından proqramlarının istənilən cihazda quraşdırılmasından əvvəl mərkəzləşdirilmiş qaydada qeydiyyatdan keçməyi və dövlət tərəfindən verilmiş şəxsiyyət sənədini təqdim etməyi tələb edəcək. Bu, yalnız Play Store-dakı deyil, bütün tətbiqlərə şamil olunur. 67-dən çox təşkilat bu siyasətə qarşı açıq məktub imzalayıb. {url} #KeepAndroidOpen"
# [en] social_callout_linkedin_2: "Android's openness has been its distinguishing feature for nearly two decades. Google is now mandating developer registration for all Android apps, including those distributed through alternative stores like F-Droid. The EFF, FSF, Tor Project, and dozens of other organizations are raising serious concerns. {url} #KeepAndroidOpen"
social_callout_linkedin_2: "Android-in açıqlığı artıq iyirmi ilə yaxındır ki, onu fərqləndirən əsas xüsusiyyət olub. İndi Google F-Droid kimi alternativ mağazalar vasitəsilə yayılanlar da daxil olmaqla, bütün Android tətbiqləri üçün tərtibatçı qeydiyyatını məcburi edir. EFF, FSF, Tor Project və onlarla digər təşkilat ciddi narahatlıqlarını bildirir. {url} #KeepAndroidOpen"
# [en] social_callout_linkedin_3: "Google's developer verification program would give a single company the technical ability to block any app, from any developer, on any certified Android device worldwide. This affects independent developers, open-source projects, and the principle that you control the software on hardware you own. {url} #KeepAndroidOpen"
social_callout_linkedin_3: "Google-un tərtibatçıların yoxlanılması proqramı tək bir şirkətə dünyanın istənilən yerində sertifikatlaşdırılmış istənilən Android cihazında istənilən tərtibatçının istənilən tətbiqini bloklamaq üçün texniki imkan verəcək. Bu, müstəqil tərtibatçılara, açıq mənbəli layihələrə və sahib olduğunuz avadanlıqda işləyən proqram təminatına sizin nəzarət etməyiniz prinsipinə təsir edir. {url} #KeepAndroidOpen"
# [en] social_callout_linkedin_4: "F-Droid estimates 85% of its open-source apps could face distribution issues under Google's new developer verification rules. The requirement for government ID and signing key evidence creates barriers for anonymous contributors, developers in sanctioned countries, and volunteer-maintained projects. {url} #KeepAndroidOpen"
social_callout_linkedin_4: "F-Droid hesab edir ki, onun açıq mənbəli tətbiqlərinin 85%-i Google-un yeni tərtibatçıların yoxlanılması qaydaları çərçivəsində yayım problemləri ilə üzləşə bilər. Dövlət tərəfindən verilmiş şəxsiyyət sənədi və imzalama açarının sübutunun tələb olunması anonim töhfə verənlər, sanksiyalar tətbiq olunan ölkələrdəki tərtibatçılar və könüllülər tərəfindən dəstəklənən layihələr üçün maneələr yaradır. {url} #KeepAndroidOpen"
# [en] social_callout_linkedin_5: "Google's proposed \"advanced flow\" for sideloading unverified apps requires 9 steps, a mandatory 24-hour waiting period, and runs entirely through Google Play Services. The community has been asked to accept a blog post as a functional safeguard. It has not appeared in any beta release. {url} #KeepAndroidOpen"
social_callout_linkedin_5: "Google-un yoxlanılmamış tətbiqlərin kənardan quraşdırılması üçün təklif etdiyi \"qabaqcıl prosedur\" 9 addım, məcburi 24 saatlıq gözləmə müddəti tələb edir və tamamilə Google Play Services üzərindən işləyir. İcmadan funksional qoruma mexanizmi kimi bir bloq yazısını qəbul etməsi istənilib. Bu funksiya heç bir beta buraxılışında təqdim edilməyib. {url} #KeepAndroidOpen"
# [en] social_callout_linkedin_6: "Digital sovereignty is at stake. Google's plan to mandate developer registration for all Android apps—even those distributed outside the Play Store—creates a central point of control and potential censorship for 3 billion devices. {url} #KeepAndroidOpen"
social_callout_linkedin_6: "Rəqəmsal suverenlik təhlükə altındadır. Google-un bütün Android tətbiqləri, hətta Play Store-dan kənarda yayılanlar üçün də tərtibatçı qeydiyyatını məcburi etmək planı 3 milyard cihaz üçün mərkəzləşdirilmiş nəzarət nöqtəsi və potensial senzura imkanı yaradır. {url} #KeepAndroidOpen"
# [en] social_callout_linkedin_7: "The 'Keep Android Open' campaign has gained support from over 67 global organizations. We are opposing Google's plan to block any application whose developer hasn't registered centrally and provided government ID. Read the open letter: {url} #KeepAndroidOpen"
social_callout_linkedin_7: "\"Keep Android Open\" kampaniyası dünyanın 67-dən çox təşkilatının dəstəyini qazanıb. Biz tərtibatçısı mərkəzləşdirilmiş qaydada qeydiyyatdan keçməmiş və dövlət tərəfindən verilmiş şəxsiyyət sənədini təqdim etməmiş istənilən tətbiqin bloklanmasına dair Google-un planına qarşı çıxırıq. Açıq məktubu oxuyun: {url} #KeepAndroidOpen"
