# What Google is doing
what_heading: "Google nə edir"
what_intro: >-
  2025-ci ilin avqustunda Google yeni bir tələb [elan etdi](https://developer.android.com/developer-verification): 2027-ci ildən etibarən, **hər bir Android tətbiq tərtibatçısı mərkəzi olaraq Google-da qeydiyyatdan keçməlidir**, əks halda onların proqram təminatı heç bir cihaza quraşdırıla bilməz. Təkcə Play Store tətbiqləri deyil: bütün tətbiqlər. Bura dostlar arasında paylaşılan, [F-Droid](https://f-droid.org) vasitəsilə yayılan, həvəskarlar tərəfindən şəxsi istifadə üçün yaradılan tətbiqlər də daxildir. Müstəqil tərtibatçılar, kilsə və icma qrupları və həvəskarlar eyni dərəcədə öz proqram təminatlarını inkişaf etdirmək və yaymaq imkanından məhrum ediləcəklər.
what_registration: "Qeydiyyat tələb edir:"
what_req_fee: "Google-a rüsum ödəməyi"
what_req_terms: "Google-un Şərtləri və Qaydaları ilə razılaşmağı"
what_req_id: "Hökumət tərəfindən verilmiş şəxsiyyət vəsiqənizi təqdim etməyi"
what_req_signing: "Şəxsi imza açarınızın (signing key) sübutunu təqdim etməyi"
what_req_appids: "Bütün cari və gələcək tətbiq identifikatorlarını sadalamağı"
what_pullquote: "Əgər tərtibatçı qaydalara əməl etməsə, onun tətbiqləri bütün dünyada hər bir Android cihazında səssizcə bloklanır."

# Who this hurts
impact_heading: "Bu kimə zərər verir"
impact_you_heading: "Sizə"
impact_you_p1: "Siz Android telefonunu almısınız, çünki Google onun açıq olduğunu demişdi. İstədiyinizi quraşdıra bilərdiniz və razılaşma belə idi."
impact_you_p2: >-
  Google indi bu razılaşmanı, onsuz da sizə məxsus olan avadanlıq üzərində geriyə dönük olaraq yenidən yazır. Yeniləmə gəldikdən sonra siz yalnız Google-un əvvəlcədən təsdiqlədiyi proqramları işlədə bilərsiniz. Öz telefonunuzda: pulunu *sizin* ödədiyiniz, *sizə* məxsus olan əmlakda.
impact_dev_heading: "Müstəqil tərtibatçılara"
impact_dev_p1: "Bir yeniyetmənin ilk tətbiqi, bir könüllünün məxfilik aləti və ya bir şirkətin məxfi daxili beta versiyası. Fərqi yoxdur. 2027-ci ildə bunların heç biri Google-un xeyir-duası olmadan quraşdırıla bilməz."
impact_dev_p2: >-
  Minlərlə pulsuz və açıq mənbəli Android tətbiqinin evi olan [F-Droid](https://f-droid.org), bunu ["ekzistensial" təhlükə](https://f-droid.org/en/2025/09/29/google-developer-registration-decree.html) adlandırıb. Cory Doctorow bunu ["Darth Android"](https://pluralistic.net/2025/09/01/fulu/) adlandırır.
impact_gov_heading: "Hökumətlər və vətəndaş cəmiyyəti"
impact_gov_p1: >-
  Avtoritar rejimlər tətbiqlərin silinməsini tələb etdikdə, Google-un onlara tabe olma [tarixçəsi sənədləşdirilib](https://www.aclu.org/news/free-speech/app-store-oligopoly). Bu proqramla, ölkənizin təsisatlarını idarə edən proqram təminatı tək bir hesabat verməyən xarici korporasiyanın iradəsindən asılı olacaq.
impact_gov_p2: >-
  [EFF](https://www.eff.org/deeplinks/2025/11/application-gatekeeping-ever-expanding-pathway-internet-censorship) tətbiqlərə nəzarəti "internet senzurasına aparan və getdikcə genişlənən bir yol" adlandırır.

# Advanced flow
flow_heading: "Google-un \"xilas qapısı\" əslində bir tələdir"
flow_intro: >-
  Google deyir ki, "təcrübəli istifadəçilər" təsdiqlənməmiş tətbiqləri ["hələ də quraşdıra"](https://android-developers.googleblog.com/2026/03/android-developer-verification.html) biləcəklər. Bəs bu *əslində* necə görünür:
flow_step1: "Sistem Ayarlarına daxil olun, Telefon Haqqında (About Phone) bölməsini tapın"
flow_step2: "Tərtibatçı Rejimini aktivləşdirmək üçün qurulma nömrəsinə (build number) **yeddi dəfə** toxunun"
flow_step3: "Məcburiyyət barədə qorxuducu ekranları rədd edin"
flow_step4: "PİN kodunuzu daxil edin"
flow_step5: "Cihazı yenidən başladın"
flow_step6: "**24 saat gözləyin**"
flow_step7: "Geri qayıdın, daha çox qorxuducu ekranları rədd edin"
flow_step8: "\"Müvəqqəti icazə ver\" (7 gün) və ya \"müddətsiz icazə ver\" seçin"
flow_step9: "\"Riskləri\" başa düşdüyünüzü bir daha təsdiqləyin"
flow_summary: "Doqquz addım. Məcburi 24 saatlıq gözləmə müddəti. *Özünüzə məxsus cihazda proqram quraşdırmaq üçün.*"
flow_detail: >-
  Daha pisi: bu proses Android ƏS-dən (OS) deyil, tamamilə **Google Play Services** vasitəsilə həyata keçirilir. Google heç bir ƏS yeniləməsi tələb olunmadan və heç bir razılıq almadan istənilən vaxt onu dəyişə, sərtləşdirə və ya ləğv edə bilər. Və bu günə kimi, bu, heç bir beta, ilkin baxış (preview) və ya canary versiyasında təqdim edilməyib. O, yalnız bir bloq yazısı və bəzi maketlər şəklində mövcuddur.

# Precedent
precedent_heading: "Bu, Android-dən daha böyük məsələdir"
precedent_pullquote: "Əgər Google açıq platforma kimi satılan milyardlarla cihazı geriyə dönük olaraq kilidləyə bilirsə, planetdəki hər bir avadanlıq istehsalçısı bunu izləyir."
precedent_p1: >-
  Qurulmaqda olan prinsip budur: **cihazınızı istehsal edən şirkət, siz onu aldıqdan sonra, hansı proqramları işlədə biləcəyinizə qərar vermək hüququ əldə edir.** Proqram təminatında bu, "ayaq altından xalçanı çəkmək" (rug pull) adlanır; lakin ən azından siz həmişə rəqib proqram təminatı quraşdıra bilərdiniz. Avadanlıqda isə bu, sizin iradənizi əlinizdən alan və sizi hesabat verməyən tək bir inhisarçının dutduğu yola qarşı gücsüz qoyan *olub-bitmiş bir faktdır* (fait accompli).
precedent_p2: >-
  Android-in açıqlığı heç vaxt sadəcə bir xüsusiyyət olmayıb. O, onu iPhone-dan fərqləndirən bir *vəd* idi. Milyonlarla insan Android-i məhz bu səbəbə görə seçdi. Google indi bu vədi, artıq insanların ciblərində olan cihazlarda təktərəfli qaydada ləğv edir, çünki onlar kifayət qədər bazar hökmranlığına malik olduqlarına qərar veriblər.
precedent_arstechnica: >-
  [Ars Technica](https://arstechnica.com/gadgets/2026/03/with-developer-verification-googles-apple-envy-threatens-to-dismantle-androids-open-legacy/): *"Google-un Apple qısqanclığı Android-in açıq irsini məhv etməklə hədələyir."*

# Objections
objections_heading: "Bir dəqiqə, məgər bu..."
obj_security_q: "\"...sadəcə təhlükəsizliklə bağlı deyilmi?\""
obj_security_a: >-
  Təhlükəsizlik əsaslandırması sadəcə gözdən pərdə asmaqdır. Google Play Protect artıq tərtibatçının kimliyindən asılı olmayaraq zərərli proqramları skan edir. Hökumət tərəfindən verilmiş şəxsiyyət vəsiqəsi tələb etmək kodu daha təhlükəsiz etmir. Bu, *tərtibatçıları* müəyyən edilə və idarə oluna bilən edir. Zərərli proqram müəllifləri qeydiyyatdan keçə bilərlər. Müstəqil tərtibatçılar və müxaliflər isə çox vaxt bunu edə bilmirlər. [EFF](https://www.eff.org/deeplinks/2025/11/application-gatekeeping-ever-expanding-pathway-internet-censorship) çox açıq danışır: kimliyə əsaslanan nəzarət (gatekeeping) təhlükəsizlik vasitəsi deyil, senzura alətidir.
obj_sideloading_q: "\"...əgər inkişaf etmiş prosesdən istifadə etsəniz, hələ də kənardan quraşdırma (sideloading) sayıla bilməzmi?\""
obj_sideloading_a: >-
  Doqquz addım, 24 saatlıq gözləmə, Tərtibatçı Ayarlarında gizlədilmiş və Google-un istədiyi vaxt ləğv edə biləcəyi xüsusi bir xidmət vasitəsilə çatdırılır. Bu, kənardan quraşdırma deyil. Bu, demək olar ki, heç kimin prosesi tamamlamamasını təmin etmək üçün qurulmuş bir **çəkindirmə mexanizmidir**. Və bu, ƏS əvəzinə Play Services vasitəsilə işlədiyinə görə, Google onu səssizcə sərtləşdirə və ya məhv edə bilər.
obj_hide_q: "\"...yalnız gizlətməyə nəsə bir şeyiniz varsa problemdir?\""
obj_hide_a: >-
  İlk qurbanlar avtoritar hökumətlər altındakı məlumat uçuranlar (whistleblowers), jurnalistlər və fəallar olacaq. Növbəti sırada məişət zorakılığı vəziyyətində olan insanlardır. Bütün bu qrupların, hüquqi kimliklərini Google bazasına daxil etmədən proqram təminatından istifadə etmək və ya paylamaq üçün qanuni səbəbləri var. Anonim açıq mənbəli töhfələr Google-un özündən də qədim bir ənənədir. Bu siyasət Android-də buna son qoyur.
obj_apple_q: "\"...Apple-ın etdiyi eyni şey deyilmi?\""
obj_apple_a: >-
  Apple ilk gündən qapalı bir bağ (walled garden) olub. İnsanlar Android-i fərqli *olduğu üçün* seçiblər. "Apple da bunu edir" demək ən dibə doğru bir yarış və zəif bir arqumentdir. Tənzimləyici təzyiq altında (AB-nin Rəqəmsal Bazarlar Aktı), hətta Apple belə açılmağa məcbur edilir. Google isə əks istiqamətdə hərəkət edir: öz nəzarətçi (gatekeeping) statusunu daha da möhkəmləndirməyə çalışır.
obj_cost_q: "\"...sadəcə 25 dollar və bəzi sənədləşmə işləri deyilmi?\""
obj_cost_a: >-
  Ola bilsin, əgər siz ABŞ-da kredit kartı və sürücülük vəsiqəsi olan bir tərtibatçısınızsa. Böyük Səhradan cənubdakı Afrikada bir tələbə, Myanmada bir müxalif və ya icma sağlamlıq tətbiqini saxlayan bir könüllü olmağa çalışın. Xərc təkcə maliyyə ilə bağlı deyil: siz hökumət tərəfindən verilmiş şəxsiyyət vəsiqənizi və imza açarlarınızın sübutunu, tətbiqləri silmək və tərtibatçıları ifşa etmək barədə hökumət tələblərinə [mütəmadi olaraq tabe olan](https://www.theregister.com/2025/08/26/android_developer_verification_sideloading/) bir şirkətə təhvil verirsiniz.

# Fight back
act_heading: "Mübarizə aparın"
act_everyone_heading: "Hər kəs üçün"
act_fdroid: >-
  Sahib olduğunuz hər bir Android cihazına **[F-Droid quraşdırın](https://f-droid.org)**. Alternativ mağazalar yalnız insanlar onlardan həqiqətən istifadə etdikdə sağ qalır.
act_regulators: >-
  **[Tənzimləyici qurumlarınızla əlaqə saxlayın.](/cta/#consumers)** Bütün dünyada tənzimləyicilər texnologiya sektorunda inhisarlar və gücün mərkəzləşməsindən həqiqətən narahatdırlar və təsirlənən və narahat olan şəxslərin fikirlərini birbaşa eşitmək istəyirlər.
act_share: >-
  **Bu səhifəni paylaşın.** Hər yerdə [keepandroidopen.org](https://keepandroidopen.org) saytına link verin.
act_astroturf: >-
  **Astroturfer-lərə qarşı çıxın.** "Əslində..." deyən kütlə tam gücü ilə iş başındadır. Onların narrativi (hekayəni) təyin etməsinə imkan verməyin.
act_petition: >-
  **[Change.org petisiyasını imzalayın](https://www.change.org/p/stop-google-from-limiting-apk-file-usage/)** və səslərini eşitdirən 100.000-dən çox imzalayan şəxsə qoşulun.
act_letter: >-
  **[Açıq məktubumuzu oxuyun və paylaşın](/open-letter)**
act_survey: >-
  Özlərinin [tərtibatçıların yoxlanılması sorğusu](https://docs.google.com/forms/d/e/1FAIpQLSfN3UQeNspQsZCO2ITkdzMxv81rJDEGGjO-UIDDY28Rz_GEVA/viewform?pli=1) vasitəsilə **bu barədə nə düşündüyünüzü Google-a bildirin** <small>(bunun bir xeyri olacaqsa təbii ki)</small>.
act_dev_heading: "Tərtibatçılar üçün"
act_dev_intro: >-
  <strong style="text-transform: uppercase;">Qeydiyyatdan keçməyin.</strong> Android Tərtibatçı Konsolunda qeydiyyatdan keçərək və onların geri qaytarıla bilməyən Şərtləri və Qaydaları ilə razılaşaraq proqrama qoşulmayın. Kimliyinizi təsdiqləməyin. *Onların oyununu oynamayın.*
act_dev_resist: "Google-un planı yalnız tərtibatçılar tabe olduqda işləyir. Tabe olmayın."
act_dev_talk: "Digər tərtibatçıları və təşkilatları qeydiyyatdan keçməməyə inandırın."
act_dev_warn: >-
  İstifadəçiləri xəbərdar etmək üçün tətbiqlərinizə [FreeDroidWarn kitabxanasını](https://github.com/woheller69/FreeDroidWarn) əlavə edin.
act_dev_banner: >-
  Veb-sayt idarə edirsiniz? [Geri sayım bannerini əlavə edin.](/banner)
act_google_heading: "Google işçiləri üçün"
act_google_text: >-
  Əgər proqramın texniki tətbiqi və ya daxili əsaslandırılması barədə nəsə bilirsinizsə, *işdən kənar* bir maşından və *Gmail olmayan* bir hesabdan [tips@keepandroidopen.org](mailto:tips@keepandroidopen.org) ünvanı ilə əlaqə saxlayın. Tam məxfilik təmin edilir.

