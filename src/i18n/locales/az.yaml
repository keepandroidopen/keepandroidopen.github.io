# Meta
title: "Keep Android Open"
description: "Your phone is about to stop being yours. In 2027, Google will block every Android app whose developer hasn't registered with them."

# Hero
hero_lede: "Your phone is about to stop being yours."
hero_countdown_label: "days until lockdown"
hero_sub: >-
  Starting in 2027[*](FAQ_URL), a silent update, nonconsensually pushed by Google, will **block every Android app** whose developer hasn't registered with Google, signed their contract, paid up, and handed over government ID.
hero_kicker: "Every app and every device, worldwide, with no opt-out."

# What Google is doing
what_heading: "What Google is doing"
what_intro: >-
  In August 2025, Google [announced](https://developer.android.com/developer-verification) a new requirement: starting in 2027, **every Android app developer must register centrally with Google** before their software can be installed on any device. Not just Play Store apps: all apps. This includes apps shared between friends, distributed through [F-Droid](https://f-droid.org), built by hobbyists for personal use. Independent developers, church and community groups, and hobbyists alike will all be frozen out of being able to develop and distribute their software.
what_registration: "Registration requires:"
what_req_fee: "Paying a fee to Google"
what_req_terms: "Agreeing to Google's Terms and Conditions"
what_req_id: "Surrendering your government-issued identification"
what_req_signing: "Providing evidence of your private signing key"
what_req_appids: "Listing all current and all future application identifiers"
what_pullquote: "If a developer does not comply, their apps get silently blocked on every Android device worldwide."

# Who this hurts
impact_heading: "Who this hurts"
impact_you_heading: "You"
impact_you_p1: "You bought an Android phone because Google told you it was open. You could install what you wanted, and that was the deal."
impact_you_p2: >-
  Google is now rewriting that deal, retroactively, on hardware you already own. After the update lands, you can only run software that Google has pre-approved. On your phone: *your* property, that *you* paid for.
impact_dev_heading: "Independent developers"
impact_dev_p1: "A teenager's first app, a volunteer's privacy tool, or a company's confidential internal beta. It doesn't matter. In 2027, none of these can be installed without Google's blessing."
impact_dev_p2: >-
  [F-Droid](https://f-droid.org), home to thousands of free and open-source Android apps, has called this an ["existential" threat](https://f-droid.org/en/2025/09/29/google-developer-registration-decree.html). Cory Doctorow calls it ["Darth Android"](https://pluralistic.net/2025/09/01/fulu/).
impact_gov_heading: "Governments & civil society"
impact_gov_p1: >-
  Google has a [documented track record](https://www.aclu.org/news/free-speech/app-store-oligopoly) of complying when authoritarian regimes demand app removals. With this program, the software that runs your country's institutions will exist at the pleasure of a single unaccountable foreign corporation.
impact_gov_p2: >-
  The [EFF calls](https://www.eff.org/deeplinks/2025/11/application-gatekeeping-ever-expanding-pathway-internet-censorship) app gatekeeping "an ever-expanding pathway to internet censorship."

# Advanced flow
flow_heading: "Google's \"escape hatch\" is a trap door"
flow_intro: >-
  Google says "power users" can ["still install"](https://android-developers.googleblog.com/2026/03/android-developer-verification.html) unverified apps. Here's what that *actually* looks like:
flow_step1: "Delve into System Settings, find About Phone"
flow_step2: "Tap the build number **seven times** to enable Developer Mode"
flow_step3: "Dismiss scare screens about coercion"
flow_step4: "Enter your PIN"
flow_step5: "Restart the device"
flow_step6: "**Wait 24 hours**"
flow_step7: "Come back, dismiss more scare screens"
flow_step8: "Pick \"allow temporarily\" (7 days) or \"allow indefinitely\""
flow_step9: "Confirm, again, that you understand \"the risks\""
flow_summary: "Nine steps. A mandatory 24-hour cooling-off period. *For installing software on a device you own.*"
flow_detail: >-
  Worse: this flow runs entirely through **Google Play Services**, not the Android OS. Google can change it, tighten it, or kill it at any time, with no OS update required and no consent needed. And as of today, it hasn't shipped in any beta, preview, or canary build. It exists only as a blog post and some mockups.

# Precedent
precedent_heading: "This is bigger than Android"
precedent_pullquote: "If Google can retroactively lock down billions of devices that were sold as open platforms, every hardware manufacturer on the planet is watching."
precedent_p1: >-
  The principle being established: **the company that made your device gets to decide, after you've bought it, what software you're allowed to run.** In software, this is called a "rug pull"; but at least you could always install competing software. In hardware, it is a *fait accompli* that strips you of your agency and renders you powerless to the whims of a single unaccountable gatekeeper and convicted monopolist.
precedent_p2: >-
  Android's openness was never just a feature. It was the *promise* that distinguished it from iPhone. Millions chose Android for exactly that reason. Google is now revoking that promise unilaterally, on devices *already* in people's pockets, because they've decided they have enough market dominance and regulatory capture to get away with it.
precedent_arstechnica: >-
  [Ars Technica](https://arstechnica.com/gadgets/2026/03/with-developer-verification-googles-apple-envy-threatens-to-dismantle-androids-open-legacy/): *"Google's Apple envy threatens to dismantle Android's open legacy."*

# Objections
objections_heading: "But wait, isn't this..."
obj_security_q: "\"...just about security?\""
obj_security_a: >-
  The security rationale is a smokescreen. Google Play Protect already scans for malware independent of developer identity. Requiring a government ID doesn't make code safer. It makes *developers* identifiable and controllable. Malware authors can register. Indie developers and dissidents often can't. The [EFF](https://www.eff.org/deeplinks/2025/11/application-gatekeeping-ever-expanding-pathway-internet-censorship) is blunt: identity-based gatekeeping is a censorship tool, not a security one.
obj_sideloading_q: "\"...still sideloading if you use the advanced flow?\""
obj_sideloading_a: >-
  Nine steps, 24-hour wait, buried in Developer Options, delivered through a proprietary service that Google can revoke whenever they want. That's not sideloading. That's a **deterrence mechanism** built to ensure almost nobody completes it. And since it runs through Play Services rather than the OS, Google can tighten or kill it silently.
obj_hide_q: "\"...only a problem if you have something to hide?\""
obj_hide_a: >-
  Whistleblowers, journalists, and activists under authoritarian governments will be the first victims. People in domestic abuse situations are next. All these groups have legitimate reasons to distribute or use software without putting their legal identity in a Google database. Anonymous open-source contribution is a tradition older than Google itself. This policy ends it on Android.
obj_apple_q: "\"...the same thing Apple does?\""
obj_apple_a: >-
  Apple has been a walled garden from day one. People chose Android *because it was different*. "Apple does it too" is a race to the bottom and a weak *tu quoque* argument. And under regulatory pressure (the EU's Digital Markets Act), even Apple is being forced to open up. Google is moving in the opposite direction: attempting to further entrench its gatekeeping status.
obj_cost_q: "\"...just $25 and some paperwork?\""
obj_cost_a: >-
  Maybe, if you're a developer in the US with a credit card and a driver's license. Try being a student in sub-Saharan Africa, or a dissident in Myanmar, or a volunteer maintaining a community health app. The cost isn't only financial: you're surrendering government ID and evidence of your signing keys to a company that [routinely complies](https://www.theregister.com/2025/08/26/android_developer_verification_sideloading/) with government demands to remove apps and expose developers.

# Fight back
act_heading: "Fight back"
act_everyone_heading: "Everyone"
act_fdroid: >-
  **[Install F-Droid](https://f-droid.org)** on every Android device you own. Alternative stores only survive if people actually use them.
act_regulators: >-
  **[Contact your regulators.](/cta/#consumers)** Regulators worldwide are genuinely concerned about monopolies and the centralization of power in the tech sector, and want to hear directly from individuals who are affected and concerned.
act_share: >-
  **Share this page.** Link to [keepandroidopen.org](https://keepandroidopen.org) everywhere.
act_astroturf: >-
  **Push back on astroturfers.** The "well, actually..." crowd is out in force. Don't let them set the narrative.
act_petition: >-
  **[Sign the change.org petition](https://www.change.org/p/stop-google-from-limiting-apk-file-usage/)** and join the over 100,000 signatories who have made their voices heard.
act_letter: >-
  **[Read and share our open letter](/open-letter)**
act_survey: >-
  **Tell Google what you think of this** through their own [developer verification survey](https://docs.google.com/forms/d/e/1FAIpQLSfN3UQeNspQsZCO2ITkdzMxv81rJDEGGjO-UIDDY28Rz_GEVA/viewform?pli=1) <small>(for all the good that will do)</small>.
act_dev_heading: "Developers"
act_dev_intro: >-
  <strong style="text-transform: uppercase;">Do not sign up.</strong> Don't join the program by signing up for the Android Developer Console and agreeing to their irrevocable Terms and Conditions. Don't verify your identity. *Don't play ball.*
act_dev_resist: "Google's plan only works if developers comply. Don't."
act_dev_talk: "Talk other developers and organizations out of signing up."
act_dev_warn: >-
  Add the [FreeDroidWarn library](https://github.com/woheller69/FreeDroidWarn) to your apps to warn users.
act_dev_banner: >-
  Run a website? [Add the countdown banner.](/banner)
act_google_heading: "Google employees"
act_google_text: >-
  If you know something about the program's technical implementation or internal rationale, contact [tips@keepandroidopen.org](mailto:tips@keepandroidopen.org) from a *non-work* machine and a *non-Gmail* account. Strict confidence guaranteed.

