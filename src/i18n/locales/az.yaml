# FAQ page
# The FAQ is rendered from an ordered list of question/answer pairs. To add a new
# entry, add a slug to `faqSlugs` in src/layouts/Faq.astro and define matching
# `faq_q_<slug>` and `faq_a_<slug>` keys here (and in each locale file).
footer_faq: "FAQ"
faq_title: "Tez-tez verilən suallar"
faq_description: "Google-un Android tərtibatçılarının yoxlanılması proqramı və tətbiqlərə qoyulacaq məhdudiyyətlərlə bağlı tez-tez verilən suallar."
faq_intro: "Google-un Android tərtibatçılarının yoxlanılması proqramı və tətbiqlərə qoyulacaq məhdudiyyətlərlə bağlı ən çox verilən suallara cavablar. Vəziyyət inkişaf etdikcə bu səhifəni yeni məlumatlarla genişləndirəcəyik."
faq_q_datechange: "Məhdudiyyətlərin tətbiq olunacağı tarix niyə 2026-cı ilin sentyabrından 2027-ci ilin yanvarına dəyişdirildi?"
faq_a_datechange: >-
  Məhdudiyyətlərin ilk olaraq 2026-cı ilin sentyabrında ilkin olaraq müəyyən edilmiş
  dörd ölkədə tətbiq olunmağa başlayacağı bildirilmişdi. Sonradan ilkin mərhələnin
  yalnız Android tətbiq mağazalarının müəyyən edilmiş siyahısına şamil ediləcəyi
  açıqlanıb və bu siyahıya F-Droid daxil deyil. Bu o deməkdir ki, sentyabr ayında
  başlanacaq tətbiqetmə F-Droid-in özünə və F-Droid vasitəsilə quraşdırılmış
  tətbiqlərə təsir GÖSTƏRMƏYƏCƏK. Məhdudiyyətlərin F-Droid istifadəçilərinə təsir
  etməyə başlayacağı tarix hələ açıqlanmayıb. Bizə təqdim edilən yeni zaman
  cədvəli ilə bağlı məlumatları bu səhifədə yeniləyəcəyik. Ətraflı məlumat üçün
  [Google-un tərtibatçıların yoxlanılması ilə bağlı tez-tez verilən suallar səhifəsinə](https://developer.android.com/developer-verification/guides/faq#general) baxın.
