social_callout_facebook_4: "Deschiderea Android a fost caracteristica sa definitorie timp de 17 ani. Milioane de oameni l-au ales în locul iPhone-ului exact din acest motiv. Google impune acum înregistrarea dezvoltatorilor pentru toate aplicațiile, inclusiv cele distribuite în afara Play Store. Dezvoltatorii independenți și proiectele open-source sunt cei mai afectați. {url}"
# [en] social_callout_facebook_5: "The EFF calls app gatekeeping \"a pathway to censorship.\" Google's developer verification would give a single company the ability to block any app, from any developer, on any certified device worldwide. This sets a precedent that extends beyond Android to the future of personal computing. {url}"
social_callout_facebook_5: "EFF numește controlul accesului la aplicații \"o cale spre cenzură\". Verificarea dezvoltatorilor Google ar oferi unei singure companii capacitatea de a bloca orice aplicație, de la orice dezvoltator, pe orice dispozitiv certificat din lume. Aceasta stabilește un precedent care depășește Android și afectează viitorul calculatoarelor personale. {url}"
# social_callout_facebook_6: "Your phone, your choice? Not if Google has its way. Starting in 2026, they plan to block any app whose developer hasn't registered and provided government ID. This affects everyone. {url}"
social_callout_facebook_6: "Telefonul tău, alegerea ta? Nu, dacă Google decide altfel. Începând din 2026, plănuiesc să blocheze orice aplicație al cărei dezvoltator nu s-a înregistrat și nu a furnizat un act de identitate emis de stat. Aceasta afectează pe toată lumea. {url}"
# social_callout_facebook_7: "Google is retroactively locking down billions of devices that were sold as open platforms. This 'rug pull' threatens independent developers and alternative app stores like F-Droid. {url}"
social_callout_facebook_7: "Google blochează retroactiv miliarde de dispozitive care au fost vândute ca platforme deschise. Această înșelătorie amenință dezvoltatorii independenți și magazinele alternative de aplicații precum F-Droid. {url}"
# social_callout_facebook_8: "Is your phone really yours? If Google can decide which apps you're allowed to install, the answer is no. Join the 100,000+ people fighting to keep Android open. {url}"
social_callout_facebook_8: "Este telefonul tău cu adevărat al tău? Dacă Google poate decide ce aplicații ai voie să instalezi, răspunsul este nu. Alătură-te celor peste 100.000 de oameni care luptă pentru a menține Android deschis. {url}"
# social_callout_facebook_9: "Google's 9-step process for 'allowing' unverified apps is a trap. It's designed to be so difficult that nobody uses it, giving Google total control. {url}"
social_callout_facebook_9: "Procesul de 9 pași al Google pentru a \"permite\" aplicații neverificate este o capcană. Este conceput să fie atât de dificil încât nimeni să nu-l folosească, oferind Google control total. {url}"
# social_callout_facebook_10: "From students building their first apps to volunteers creating privacy tools, Google's mandatory registration policy will freeze out innovation. Help us keep Android open! {url}"
social_callout_facebook_10: "De la studenți care își construiesc prima aplicație până la voluntari care creează instrumente de confidențialitate, politica de înregistrare obligatorie a Google va îngheța inovația. Ajută-ne să menținem Android deschis! {url}"
