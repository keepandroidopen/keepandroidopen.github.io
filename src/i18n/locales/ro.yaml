# [en] social_callout_bluesky_5: "The EFF warns that Google's developer verification creates \"a pathway to censorship.\" Developers in restrictive countries, anonymous open-source contributors, and privacy tool maintainers are among those most affected. @keepandroidopen.bsky.social {url}"
social_callout_bluesky_5: "EFF avertizează că verificarea dezvoltatorilor Google creează \"o cale spre cenzură\". Dezvoltatorii din țări represive, contribuitorii open-source anonimi și întreținătorii instrumentelor de confidențialitate se numără printre cei mai afectați. @keepandroidopen.bsky.social {url}"
# [en] social_callout_bluesky_6: "Google's plan to block unverified apps is a 'rug pull' on the 3 billion people who chose Android for its openness. Don't let them turn your phone into a walled garden. @keepandroidopen.bsky.social #KeepAndroidOpen {url}"
social_callout_bluesky_6: "Planul Google de a bloca aplicațiile neverificate este o înșelătorie față de cele 3 miliarde de oameni care au ales Android pentru deschiderea sa. Nu-i lăsa să-ți transforme telefonul într-o \"grădină cu ziduri\". @keepandroidopen.bsky.social #KeepAndroidOpen {url}"
# social_callout_bluesky_7: "Ownership means control. If Google can block any app on your phone, you don't really own it. Join the 100,000+ people fighting to keep Android open. @keepandroidopen.bsky.social {url}"
social_callout_bluesky_7: "A deține înseamnă a controla. Dacă Google poate bloca orice aplicație de pe telefonul tău, nu-l deții cu adevărat. Alătură-te celor peste 100.000 de oameni care luptă pentru a menține Android deschis. @keepandroidopen.bsky.social {url}"
# social_callout_bluesky_8: "Mandatory ID registration for every app developer? This is a dream for censors and a nightmare for privacy. Protect the open web and open mobile. @keepandroidopen.bsky.social {url}"
social_callout_bluesky_8: "Înregistrare obligatorie cu act de identitate pentru fiecare dezvoltator de aplicații? Este un vis pentru cenzori și un coșmar pentru confidențialitate. Protejează web-ul deschis și mobilul deschis. @keepandroidopen.bsky.social {url}"
# social_callout_bluesky_9: "Sideloading shouldn't require a 24-hour waiting period and a 9-step gauntlet. Google's 'advanced flow' is designed to fail. Keep Android Open! @keepandroidopen.bsky.social {url}"
social_callout_bluesky_9: "Sideloading-ul nu ar trebui să necesite o perioadă de așteptare de 24 de ore și un traseu de 9 pași. \"Fluxul avansat\" al Google este conceput să eșueze. Menține Android deschis! @keepandroidopen.bsky.social {url}"
# social_callout_bluesky_10: "From F-Droid to independent devs, the entire Android ecosystem is under threat from Google's new mandatory registration decree. See why 67+ orgs are saying no: {url}"
social_callout_bluesky_10: "De la F-Droid la dezvoltatorii independenți, întregul ecosistem Android este amenințat de noul decret de înregistrare obligatorie al Google. Vezi de ce peste 67 de organizații spun nu: {url}"
# [en] social_callout_mastodon_1: "Starting September 2026, Google will require every Android app developer to register centrally, provide government ID, and submit signing key evidence. Apps from unregistered developers will be blocked on all certified devices worldwide. This threatens F-Droid, open-source distribution, and user autonomy. @keepandroidopen@techhub.social #KeepAndroidOpen {url}"
social_callout_mastodon_1: "Începând din septembrie 2026, Google va impune ca fiecare dezvoltator de aplicații Android să se înregistreze central, să furnizeze un act de identitate emis de stat și să prezinte dovada cheilor de semnare. Aplicațiile dezvoltatorilor neînregistrați vor fi blocate pe toate dispozitivele certificate din lume. Aceasta amenință F-Droid, distribuția open-source și autonomia utilizatorilor. @keepandroidopen@techhub.social #KeepAndroidOpen {url}"
# [en] social_callout_mastodon_2: "Google's Android Developer Verification program requires government ID, signing key evidence, and a fee for any developer who wants their software installable on Android. The EFF calls app gatekeeping \"a pathway to censorship.\" over 67 organizations have signed an open letter opposing it. @keepandroidopen@techhub.social #KeepAndroidOpen {url}"
social_callout_mastodon_2: "Programul Android Developer Verification al Google impune act de identitate emis de stat, dovada cheilor de semnare și o taxă pentru orice dezvoltator care dorește ca software-ul său să poată fi instalat pe Android. EFF numește controlul accesului la aplicații \"o cale spre cenzură\". Peste 67 de organizații au semnat o scrisoare deschisă împotriva acestuia. @keepandroidopen@techhub.social #KeepAndroidOpen {url}"
# [en] social_callout_mastodon_3: "F-Droid, home to thousands of free and open-source Android apps, calls Google's developer verification an \"existential threat.\" An estimated 85% of F-Droid apps could face distribution issues because their developers signed through F-Droid, not through Google. @keepandroidopen@techhub.social #KeepAndroidOpen {url}"
social_callout_mastodon_3: "F-Droid, gazdă a mii de aplicații Android gratuite și open-source, numește verificarea dezvoltatorilor Google o \"amenințare existențială\". Se estimează că 85% dintre aplicațiile F-Droid ar putea întâmpina probleme de distribuție deoarece dezvoltatorii lor au semnat prin F-Droid, nu prin Google. @keepandroidopen@techhub.social #KeepAndroidOpen {url}"
# [en] social_callout_mastodon_4: "Google's proposed workaround for sideloading unverified apps requires 9 steps, a mandatory 24-hour waiting period, and is delivered through Google Play Services, not the Android OS. Google can modify or remove it at any time without user consent. It hasn't shipped in any beta. @keepandroidopen@techhub.social #KeepAndroidOpen {url}"
social_callout_mastodon_4: "Soluția propusă de Google pentru sideloading-ul aplicațiilor neverificate necesită 9 pași, o perioadă obligatorie de așteptare de 24 de ore și este livrată prin Google Play Services, nu prin sistemul de operare Android. Google o poate modifica sau elimina oricând, fără consimțământul utilizatorului. Nu a fost lansată în nicio versiune beta. @keepandroidopen@techhub.social #KeepAndroidOpen {url}"
# [en] social_callout_mastodon_5: "The mandatory developer registration Google is imposing on Android raises concerns for developers in sanctioned countries, anonymous open-source contributors, and anyone building privacy or security tools. Google has a documented history of complying with government demands to remove apps. @keepandroidopen@techhub.social #KeepAndroidOpen {url}"
social_callout_mastodon_5: "Înregistrarea obligatorie a dezvoltatorilor impusă de Google pe Android ridică îngrijorări pentru dezvoltatorii din țări sancționate, contribuitorii open-source anonimi și oricine construiește instrumente de confidențialitate sau securitate. Google are un istoric documentat de conformare cu cerințele guvernamentale de eliminare a aplicațiilor. @keepandroidopen@techhub.social #KeepAndroidOpen {url}"
# social_callout_mastodon_6: "Android's strength was its decentralized nature. Google's plan to mandate central registration for every single app developer destroys that. We must resist this centralization of power. @keepandroidopen@techhub.social #KeepAndroidOpen {url}"
social_callout_mastodon_6: "Forța Android a fost natura sa descentralizată. Planul Google de a impune înregistrarea centrală pentru fiecare dezvoltator de aplicații distruge acest lucru. Trebuie să rezistăm acestei centralizări a puterii. @keepandroidopen@techhub.social #KeepAndroidOpen {url}"
# social_callout_mastodon_7: "If you bought the hardware, you should have the final say on the software. Google's plan to block unverified apps is a direct attack on user sovereignty. {url} @keepandroidopen@techhub.social #KeepAndroidOpen"
social_callout_mastodon_7: "Dacă ai cumpărat hardware-ul, ar trebui să ai ultimul cuvânt asupra software-ului. Planul Google de a bloca aplicațiile neverificate este un atac direct asupra suveranității utilizatorilor. {url} @keepandroidopen@techhub.social #KeepAndroidOpen"
# social_callout_mastodon_8: "Imagine a world where every small hobbyist or volunteer dev has to register with a global corporation just to share their work. That's the world Google is building for Android in 2026. {url} @keepandroidopen@techhub.social"
social_callout_mastodon_8: "Imaginează-ți o lume în care fiecare mic pasionat sau dezvoltator voluntar trebuie să se înregistreze la o corporație globală doar pentru a-și distribui munca. Aceasta este lumea pe care Google o construiește pentru Android în 2026. {url} @keepandroidopen@techhub.social"
# social_callout_mastodon_9: "Google's 'advanced flow' for sideloading is a deterrence mechanism, not an escape hatch. 9 steps and a 24-hour wait for software you own? No thanks. @keepandroidopen@techhub.social #KeepAndroidOpen {url}"
social_callout_mastodon_9: "\"Fluxul avansat\" al Google pentru sideloading este un mecanism de descurajare, nu o ieșire de urgență. 9 pași și o așteptare de 24 de ore pentru software pe care îl deții? Nu, mulțumesc. @keepandroidopen@techhub.social #KeepAndroidOpen {url}"
# social_callout_mastodon_10: "Over 100,000 people and 67+ organizations are standing up to Google's attempt to lock down Android. Join the fight for a truly open mobile ecosystem. {url} @keepandroidopen@techhub.social #KeepAndroidOpen"
social_callout_mastodon_10: "Peste 100.000 de oameni și peste 67 de organizații se opun încercării Google de a bloca Android. Alătură-te luptei pentru un ecosistem mobil cu adevărat deschis. {url} @keepandroidopen@techhub.social #KeepAndroidOpen"
