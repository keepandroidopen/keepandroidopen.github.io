# [en] title: "Keep Android Open"
title: "Keep Android Open"
# [en] description: "Your phone is about to stop being yours. In September 2026, Google will block every Android app whose developer hasn't registered with them."
description: "Telefonul tău este pe cale să nu-ți mai aparțină. În septembrie 2026, Google va bloca fiecare aplicație Android al cărei dezvoltator nu s-a înregistrat la ei."
# [en] hero_lede: "Your phone is about to stop being yours."
hero_lede: "Telefonul tău este pe cale să nu-ți mai aparțină."
# [en] hero_countdown_label: "days until lockdown"
hero_countdown_label: "zile până la blocare"
# [en] hero_sub: "Starting September 2026, a silent update, nonconsensually pushed by Google, will **block every Android app** whose developer hasn't registered with Google, signed their contract, paid up, and handed over government ID."
hero_sub: "Începând din septembrie 2026, o actualizare silențioasă, impusă de Google fără acordul utilizatorilor, **va bloca fiecare aplicație Android** al cărei dezvoltator nu s-a înregistrat la Google, nu a semnat contractul lor și nu a plătit taxa cerută."
# [en] hero_kicker: "Every app and every device, worldwide, with no opt-out."
hero_kicker: "Fiecare aplicație și fiecare dispozitiv, la nivel mondial, fără posibilitate de renunțare."
# [en] what_heading: "What Google is doing"
what_heading: "Ce face Google"
# [en] what_intro: "In August 2025, Google [announced](https://developer.android.com/developer-verification) a new requirement: starting September 2026, **every Android app developer must register centrally with Google** before their software can be installed on any device. Not just Play Store apps: all apps. This includes apps shared between friends, distributed through [F-Droid](https://f-droid.org), built by hobbyists for personal use. Independent developers, church and community groups, and hobbyists alike will all be frozen out of being able to develop and distribute their software."
what_intro: >-
  În august 2025, Google a [anunțat](https://developer.android.com/developer-verification) o nouă cerință: începând din septembrie 2026, **fiecare dezvoltator de aplicații Android trebuie
  să se înregistreze central la Google** înainte ca software-ul său să poată fi instalat pe orice dispozitiv. Nu doar aplicațiile din Play Store: toate aplicațiile. Aceasta include aplicații
  distribuite între prieteni, distribuite prin [F-Droid](https://f-droid.org), create de pasionați pentru uz personal. Dezvoltatorii independenți, grupurile bisericești și comunitare,
  precum și pasionații deopotrivă vor fi blocați de la posibilitatea de a-și dezvolta și distribui software-ul.
# [en] what_registration: "Registration requires:"
what_registration: "Înregistrarea necesită:"
# [en] what_req_fee: "Paying a fee to Google"
what_req_fee: "Plata unei taxe către Google"
# [en] what_req_terms: "Agreeing to Google's Terms and Conditions"
what_req_terms: "Acceptarea Termenilor și Condițiilor Google"
# [en] what_req_id: "Surrendering your government-issued identification"
what_req_id: "Predarea actului de identitate emis de stat"
# [en] what_req_signing: "Providing evidence of your private signing key"
what_req_signing: "Furnizarea dovezii cheii tale private de semnare"
# [en] what_req_appids: "Listing all current and all future application identifiers"
what_req_appids: "Listarea tuturor identificatorilor de aplicații actuali și viitori"
# [en] what_pullquote: "If a developer does not comply, their apps get silently blocked on every Android device worldwide."
what_pullquote: "Dacă un dezvoltator nu se conformează, aplicațiile sale sunt blocate silențios pe fiecare dispozitiv Android din lume."
# [en] impact_heading: "Who this hurts"
impact_heading: "Pe cine afectează"
# [en] impact_you_heading: "You"
impact_you_heading: "Pe tine"
# [en] impact_you_p1: "You bought an Android phone because Google told you it was open. You could install what you wanted, and that was the deal."
impact_you_p1: "Ai cumpărat un telefon Android pentru că Google ți-a spus că este un sistem deschis. Puteai instala ce doreai, iar aceasta era înțelegerea."
# [en] impact_you_p2: "Google is now rewriting that deal, retroactively, on hardware you already own. After the update lands, you can only run software that Google has pre-approved. On your phone: *your* property, that *you* paid for."
impact_you_p2: >-
  Google rescrie acum acea înțelegere, retroactiv, pe hardware-ul pe care îl deții deja. După ce actualizarea va fi aplicată, vei putea rula doar software pre-aprobat de Google. Pe telefonul tău: *proprietatea ta*,
  pentru care *tu* ai plătit.
# [en] impact_dev_heading: "Independent developers"
impact_dev_heading: "Dezvoltatori independenți"
# [en] impact_dev_p1: "A teenager's first app, a volunteer's privacy tool, or a company's confidential internal beta. It doesn't matter. After September 2026, none of these can be installed without Google's blessing."
impact_dev_p1: "Prima aplicație a unui adolescent, un instrument de confidențialitate creat de un voluntar sau versiunea beta internă confidențială a unei companii — nu contează. După septembrie 2026, niciuna dintre acestea nu va putea fi instalată fără binecuvântarea Google."
# [en] impact_dev_p2: "[F-Droid](https://f-droid.org), home to thousands of free and open-source Android apps, has called this an [\"existential\" threat](https://f-droid.org/en/2025/09/29/google-developer-registration-decree.html). Cory Doctorow calls it [\"Darth Android\"](https://pluralistic.net/2025/09/01/fulu/)."
impact_dev_p2: >-
  [F-Droid](https://f-droid.org), gazdă a mii de aplicații Android gratuite și open-source, a numit aceasta o
  [amenințare "existențială"](https://f-droid.org/en/2025/09/29/google-developer-registration-decree.html).
  Cory Doctorow o numește ["Darth Android"](https://pluralistic.net/2025/09/01/fulu/).
# [en] impact_gov_heading: "Governments & civil society"
impact_gov_heading: "Guverne și societate civilă"
# [en] impact_gov_p1: "Google has a [documented track record](https://www.aclu.org/news/free-speech/app-store-oligopoly) of complying when authoritarian regimes demand app removals. With this program, the software that runs your country's institutions will exist at the pleasure of a single unaccountable foreign corporation."
impact_gov_p1: >-
  Google [s-a conformat în mod documentat, în trecut](https://www.aclu.org/news/free-speech/app-store-oligopoly), atunci când regimuri autoritare au cerut eliminarea unor aplicații.
  Prin acest program, software-ul care rulează instituțiile țării tale va exista la bunul plac al unei singure corporații străine, netrase la răspundere.
# [en] impact_gov_p2: "The [EFF calls](https://www.eff.org/deeplinks/2025/11/application-gatekeeping-ever-expanding-pathway-internet-censorship) app gatekeeping \"an ever-expanding pathway to internet censorship.\""
impact_gov_p2: >-
  [EFF numește](https://www.eff.org/deeplinks/2025/11/application-gatekeeping-ever-expanding-pathway-internet-censorship) controlul accesului la aplicații "o cale mereu în expansiune
  spre cenzura pe internet."
# [en] flow_heading: "Google's \"escape hatch\" is a trap door"
flow_heading: "\"Ieșirea de urgență\" a Google este o trapă capcană"
# [en] flow_intro: "Google says \"power users\" can [\"still install\"](https://android-developers.googleblog.com/2026/03/android-developer-verification.html) unverified apps. Here's what that *actually* looks like:"
flow_intro: >-
  Google spune că "utilizatorii avansați" pot ["instala în continuare"](https://android-developers.googleblog.com/2026/03/android-developer-verification.html) aplicații neverificate.
  Iată cum arată asta *în realitate*:
# [en] flow_step1: "Delve into System Settings, find Developer Options"
flow_step1: "Intri în Setările sistemului și cauți Opțiunile pentru dezvoltatori."
# [en] flow_step2: "Tap the build number **seven times** to enable Developer Mode"
flow_step2: "Apeși pe numărul versiunii build de **șapte ori** pentru a activa Modul dezvoltator."
# [en] flow_step3: "Dismiss scare screens about coercion"
flow_step3: "Închizi ecranele de avertizare alarmante despre constrângere."
# [en] flow_step4: "Enter your PIN"
flow_step4: "Introduci codul PIN."
# [en] flow_step5: "Restart the device"
flow_step5: "Repornești dispozitivul."
# [en] flow_step6: "**Wait 24 hours**"
flow_step6: "**Aștepți 24 de ore**."
# [en] flow_step7: "Come back, dismiss more scare screens"
flow_step7: "Revii și închizi mai multe ecrane de avertizare alarmante."
# [en] flow_step8: "Pick \"allow temporarily\" (7 days) or \"allow indefinitely\""
flow_step8: "Alegi \"permite temporar\" (7 zile) sau \"permite pe termen nelimitat\"."
# [en] flow_step9: "Confirm, again, that you understand \"the risks\""
flow_step9: "Confirmi, din nou, că înțelegi \"riscurile\"."
# [en] flow_summary: "Nine steps. A mandatory 24-hour cooling-off period. *For installing software on a device you own.*"
flow_summary: "Nouă pași. O perioadă obligatorie de reflecție de 24 de ore. *Pentru a instala software pe un dispozitiv pe care îl deții.*"
# [en] flow_detail: "Worse: this flow runs entirely through **Google Play Services**, not the Android OS. Google can change it, tighten it, or kill it at any time, with no OS update required and no consent needed. And as of today, it hasn't shipped in any beta, preview, or canary build. It exists only as a blog post and some mockups."
flow_detail: >-
  Mai rău: acest flux rulează în întregime prin **Google Play Services**, nu prin sistemul de operare Android. Google îl poate modifica, restrânge sau elimina oricând, fără să fie nevoie
  de o actualizare a sistemului de operare și fără a fi necesar consimțământul tău. Iar până astăzi, nu a fost lansat în nicio versiune beta, preview sau canary. Există doar sub forma
  unei postări de blog și a câtorva machete.
# [en] precedent_heading: "This is bigger than Android"
precedent_heading: "Aceasta este mai mult decât Android."
# [en] precedent_pullquote: "If Google can retroactively lock down billions of devices that were sold as open platforms, every hardware manufacturer on the planet is watching."
precedent_pullquote: "Dacă Google poate bloca retroactiv miliarde de dispozitive care au fost vândute ca platforme deschise, fiecare producător de hardware de pe planetă urmărește cu atenție."
# [en] precedent_p1: "The principle being established: **the company that made your device gets to decide, after you've bought it, what software you're allowed to run.** In software, this is called a \"rug pull\"; but at least you could always install competing software. In hardware, it is a *fait accompli* that strips you of your agency and renders you powerless to the whims of a single unaccountable gatekeeper and convicted monopolist."
precedent_p1: >-
  Principiul care se stabilește: **compania care ți-a produs dispozitivul are dreptul să decidă, după ce l-ai cumpărat, ce software ai voie să rulezi.** În lumea software-ului,
  aceasta se numește "rug pull"; dar cel puțin puteai întotdeauna instala software concurent. În lumea hardware-ului, este un *fait accompli* care te lipsește de capacitatea de a decide
  și te lasă neputincios în fața capriciilor unui singur gardian netras la răspundere și monopolist condamnat.
# [en] precedent_p2: "Android's openness was never just a feature. It was the *promise* that distinguished it from iPhone. Millions chose Android for exactly that reason. Google is now revoking that promise unilaterally, on devices *already* in people's pockets, because they've decided they have enough market dominance and regulatory capture to get away with it."
precedent_p2: >-
  Deschiderea Android nu a fost niciodată doar o caracteristică. A fost *promisiunea* care îl deosebea de iPhone. Milioane de oameni au ales Android exact din acest motiv. Google revocă
  acum acea promisiune în mod unilateral, pe dispozitive aflate *deja* în buzunarele oamenilor, pentru că a decis că are suficientă dominație de piață și influență asupra autorităților
  de reglementare pentru a scăpa nepedepsit.
# [en] precedent_arstechnica: "[Ars Technica](https://arstechnica.com/gadgets/2026/03/with-developer-verification-googles-apple-envy-threatens-to-dismantle-androids-open-legacy/): *\"Google's Apple envy threatens to dismantle Android's open legacy.\"*"
precedent_arstechnica: >-
  [Ars Technica](https://arstechnica.com/gadgets/2026/03/with-developer-verification-googles-apple-envy-threatens-to-dismantle-androids-open-legacy/): *"Invidia Google
  față de Apple amenință să demonteze moștenirea deschisă a Android."*
# [en] objections_heading: "But wait, isn't this..."
objections_heading: "Dar stai, nu este asta…"
# [en] obj_security_q: "\"...just about security?\""
obj_security_q: "\"… doar despre securitate?\""
# [en] obj_security_a: "The security rationale is a smokescreen. Google Play Protect already scans for malware independent of developer identity. Requiring a government ID doesn't make code safer. It makes *developers* identifiable and controllable. Malware authors can register. Indie developers and dissidents often can't. The [EFF](https://www.eff.org/deeplinks/2025/11/application-gatekeeping-ever-expanding-pathway-internet-censorship) is blunt: identity-based gatekeeping is a censorship tool, not a security one."
obj_security_a: >-
  Justificarea de securitate este o cortină de fum. Google Play Protect scanează deja după malware independent de identitatea dezvoltatorului. Solicitarea unui act de identitate emis
  de stat nu face codul mai sigur. Îi face pe *dezvoltatori* identificabili și controlabili. Autorii de malware se pot înregistra. Dezvoltatorii independenți și disidenții adesea nu pot.
  [EFF](https://www.eff.org/deeplinks/2025/11/application-gatekeeping-ever-expanding-pathway-internet-censorship) este tranșant: controlul accesului bazat pe identitate este un instrument
  de cenzură, nu unul de securitate.
# [en] obj_sideloading_q: "\"...still sideloading if you use the advanced flow?\""
obj_sideloading_q: "\"… tot sideloading dacă folosești fluxul avansat?\""
# [en] obj_sideloading_a: "Nine steps, 24-hour wait, buried in Developer Options, delivered through a proprietary service that Google can revoke whenever they want. That's not sideloading. That's a **deterrence mechanism** built to ensure almost nobody completes it. And since it runs through Play Services rather than the OS, Google can tighten or kill it silently."
obj_sideloading_a: >-
  Nouă pași, o așteptare de 24 de ore, ascunsă în Opțiunile pentru dezvoltatori, livrată printr-un serviciu proprietar pe care Google îl poate revoca oricând dorește. Acesta nu este
  sideloading. Este un **mecanism de descurajare** construit pentru a se asigura că aproape nimeni nu îl finalizează. Iar, întrucât rulează prin Play Services și nu prin sistemul de
  operare, Google îl poate restrânge sau elimina în tăcere.
# [en] obj_hide_q: "\"...only a problem if you have something to hide?\""
obj_hide_q: "\"… o problemă doar dacă ai ceva de ascuns?\""
# [en] obj_hide_a: "Whistleblowers, journalists, and activists under authoritarian governments will be the first victims. People in domestic abuse situations are next. All these groups have legitimate reasons to distribute or use software without putting their legal identity in a Google database. Anonymous open-source contribution is a tradition older than Google itself. This policy ends it on Android."
obj_hide_a: >-
  Avertizorii de integritate, jurnaliștii și activiștii aflați sub guverne autoritare vor fi primele victime. Persoanele aflate în situații de abuz domestic urmează. Toate aceste grupuri
  au motive legitime să distribuie sau să utilizeze software fără a-și pune identitatea legală într-o bază de date Google. Contribuția anonimă la proiecte open-source este o tradiție
  mai veche decât Google însuși. Această politică o încheie pe Android.
# [en] obj_apple_q: "\"...the same thing Apple does?\""
obj_apple_q: "\"… același lucru pe care îl face Apple?\""
# [en] obj_apple_a: "Apple has been a walled garden from day one. People chose Android *because it was different*. \"Apple does it too\" is a race to the bottom and a weak *tu quoque* argument. And under regulatory pressure (the EU's Digital Markets Act), even Apple is being forced to open up. Google is moving in the opposite direction: attempting to further entrench its gatekeeping status."
obj_apple_a: >-
  Apple a fost o "grădină cu ziduri" încă din prima zi. Oamenii au ales Android *pentru că era diferit*. "Și Apple face asta" este o cursă spre fund și un argument slab de tip *tu quoque*.
  Iar sub presiunea reglementărilor (Legea privind piețele digitale a UE), chiar și Apple este forțat să se deschidă. Google se îndreaptă în direcția opusă: încearcă să-și consolideze
  și mai mult statutul de gardian al accesului.
# [en] obj_cost_q: "\"...just $25 and some paperwork?\""
obj_cost_q: "\"… doar 25 de dolari și niște formalități?\""
# [en] obj_cost_a: "Maybe, if you're a developer in the US with a credit card and a driver's license. Try being a student in sub-Saharan Africa, or a dissident in Myanmar, or a volunteer maintaining a community health app. The cost isn't only financial: you're surrendering government ID and evidence of your signing keys to a company that [routinely complies](https://www.theregister.com/2025/08/26/android_developer_verification_sideloading/) with government demands to remove apps and expose developers."
obj_cost_a: >-
  Poate, dacă ești dezvoltator în SUA, cu un card de credit și un permis de conducere. Încearcă să fii student în Africa subsahariană, disident în Myanmar sau voluntar care întreține
  o aplicație de sănătate comunitară. Costul nu este doar financiar: predai actul de identitate emis de stat și dovada cheilor tale de semnare unei companii care
  [se conformează frecvent](https://www.theregister.com/2025/08/26/android_developer_verification_sideloading/) cerințelor guvernamentale de eliminare a aplicațiilor și de expunere
  a dezvoltatorilor.
