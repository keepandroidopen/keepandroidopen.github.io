act_everyone_heading: "Toată lumea"
# [en] act_fdroid: "**[Install F-Droid](https://f-droid.org)** on every Android device you own. Alternative stores only survive if people actually use them."
act_fdroid: >-
  **[Instalează F-Droid](https://f-droid.org)** pe fiecare dispozitiv Android pe care îl deții. Magazinele alternative supraviețuiesc doar dacă oamenii chiar le folosesc.
# [en] act_regulators: "**[Contact your regulators.](/cta/#consumers)** Regulators worldwide are genuinely concerned about monopolies and the centralization of power in the tech sector, and want to hear directly from individuals who are affected and concerned."
act_regulators: >-
  **[Contactează autoritățile de reglementare.](/cta/#consumers)** Autoritățile de reglementare din întreaga lume sunt sincer preocupate de monopoluri și de centralizarea puterii
  în sectorul tehnologic și vor să audă direct de la persoanele afectate și îngrijorate.
# [en] act_share: "**Share this page.** Link to [keepandroidopen.org](https://keepandroidopen.org) everywhere."
act_share: >-
  **Distribuie această pagină.** Pune un link către [keepandroidopen.org](https://keepandroidopen.org) peste tot.
# [en] act_astroturf: "**Push back on astroturfers.** The \"well, actually...\" crowd is out in force. Don't let them set the narrative."
act_astroturf: >-
  **Reacționează împotriva astroturfing-ului.** Gașca "păi, de fapt…" este în forță deplină. Nu-i lăsa să impună narativul.
# [en] act_petition: "**[Sign the change.org petition](https://www.change.org/p/stop-google-from-limiting-apk-file-usage/)** and join the over 100,000 signatories who have made their voices heard."
act_petition: >-
  **[Semnează petiția pe change.org](https://www.change.org/p/stop-google-from-limiting-apk-file-usage/)** și alătură-te celor peste 100.000 de semnatari care și-au făcut vocea auzită.
# [en] act_letter: "**[Read and share our open letter](/open-letter)**"
act_letter: >-
  **[Citește și distribuie scrisoarea noastră deschisă](/open-letter)**
# [en] act_survey: "**Tell Google what you think of this** through their own [developer verification survey](https://docs.google.com/forms/d/e/1FAIpQLSfN3UQeNspQsZCO2ITkdzMxv81rJDEGGjO-UIDDY28Rz_GEVA/viewform?pli=1) <small>(for all the good that will do)</small>."
act_survey: >-
  **Spune-i Google ce crezi despre asta** prin propriul lor [chestionar despre verificarea dezvoltatorilor](https://docs.google.com/forms/d/e/1FAIpQLSfN3UQeNspQsZCO2ITkdzMxv81rJDEGGjO-UIDDY28Rz_GEVA/viewform?pli=1)
  <small>(oricât de mult ar folosi asta)</small>.
# [en] act_dev_heading: "Developers"
act_dev_heading: "Dezvoltatori"
# [en] act_dev_intro: "<strong style=\"text-transform: uppercase;\">Do not sign up.</strong> Don't join the program by signing up for the Android Developer Console and agreeing to their irrevocable Terms and Conditions. Don't verify your identity. *Don't play ball.*"
act_dev_intro: >-
  <strong style="text-transform: uppercase;">Nu te înregistra.</strong> Nu te alătura programului înregistrându-te în Android Developer Console și acceptând Termenii și Condițiile
