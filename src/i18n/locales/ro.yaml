social_callout_bluesky_2: "Google impune tuturor dezvoltatorilor Android să se înregistreze central, să plătească o taxă și să furnizeze un act de identitate emis de stat. Aplicațiile dezvoltatorilor neînregistrați vor fi blocate silențios. Peste 67 de organizații se opun. @keepandroidopen.bsky.social {url}"
# [en] social_callout_bluesky_3: "After 17 years of marketing Android as an open platform, Google is mandating developer registration for all apps. Independent developers, open-source contributors, and alternative stores like F-Droid face an uncertain future. @keepandroidopen.bsky.social {url}"
