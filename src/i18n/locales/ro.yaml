# social_callout_linkedin_6: "Digital sovereignty is at stake. Google's plan to mandate developer registration for all Android apps—even those distributed outside the Play Store—creates a central point of control and potential censorship for 3 billion devices. {url} #KeepAndroidOpen"
social_callout_linkedin_6: "Suveranitatea digitală este în joc. Planul Google de a impune înregistrarea dezvoltatorilor pentru toate aplicațiile Android — chiar și cele distribuite în afara Play Store — creează un punct central de control și un potențial de cenzură pentru 3 miliarde de dispozitive. {url} #KeepAndroidOpen"
# social_callout_linkedin_7: "The 'Keep Android Open' campaign has gained support from over 67 global organizations. We are opposing Google's plan to block any application whose developer hasn't registered centrally and provided government ID. Read the open letter: {url} #KeepAndroidOpen"
social_callout_linkedin_7: "Campania \"Keep Android Open\" a câștigat sprijinul a peste 67 de organizații globale. Ne opunem planului Google de a bloca orice aplicație al cărei dezvoltator nu s-a înregistrat central și nu a furnizat un act de identitate emis de stat. Citește scrisoarea deschisă: {url} #KeepAndroidOpen"
# social_callout_linkedin_8: "Retroactively changing the rules for hardware people already own is a dangerous precedent. Google's mandatory developer verification strips users of their agency and forces them into a managed ecosystem. {url} #KeepAndroidOpen"
social_callout_linkedin_8: "Schimbarea retroactivă a regulilor pentru hardware-ul pe care oamenii îl dețin deja este un precedent periculos. Verificarea obligatorie a dezvoltatorilor impusă de Google îi lipsește pe utilizatori de capacitatea de decizie și îi forțează într-un ecosistem controlat. {url} #KeepAndroidOpen"
# social_callout_linkedin_9: "F-Droid and the EFF have raised the alarm: Google's developer verification program is an 'existential threat' to alternative app distribution. We must protect the open-source ecosystem that built Android. {url} #KeepAndroidOpen"
social_callout_linkedin_9: "F-Droid și EFF au tras un semnal de alarmă: programul de verificare a dezvoltatorilor Google este o \"amenințare existențială\" pentru distribuția alternativă de aplicații. Trebuie să protejăm ecosistemul open-source care a construit Android. {url} #KeepAndroidOpen"
# social_callout_linkedin_10: "As Google moves to further entrench its gatekeeping status, the community is pushing back. Your device should be your property, not a leased terminal subject to retroactive restrictions. Join the movement: {url} #KeepAndroidOpen"
social_callout_linkedin_10: "Pe măsură ce Google își consolidează și mai mult statutul de gardian al accesului, comunitatea reacționează. Dispozitivul tău ar trebui să fie proprietatea ta, nu un terminal închiriat supus unor restricții retroactive. Alătură-te mișcării: {url} #KeepAndroidOpen"
