# [en] social_callout_x_1: "Starting September 2026, Google will block any Android app whose developer hasn't registered and provided government ID. This affects every Android device worldwide. Learn more: {url} @AlteredDeal #KeepAndroidOpen"
social_callout_x_1: "Începând din septembrie 2026, Google va bloca orice aplicație Android al cărei dezvoltator nu s-a înregistrat și nu a furnizat un act de identitate emis de stat. Aceasta afectează fiecare dispozitiv Android din lume. Află mai multe: {url} @AlteredDeal #KeepAndroidOpen"
# [en] social_callout_x_2: "Google announced that all Android app developers must register centrally, pay a fee, and submit government ID, or their apps will be blocked on every device. over 67 organizations oppose this. {url} @AlteredDeal #KeepAndroidOpen"
social_callout_x_2: "Google a anunțat că toți dezvoltatorii de aplicații Android trebuie să se înregistreze central, să plătească o taxă și să furnizeze un act de identitate emis de stat, altfel aplicațiile lor vor fi blocate pe fiecare dispozitiv. Peste 67 de organizații se opun. {url} @AlteredDeal #KeepAndroidOpen"
# [en] social_callout_x_3: "Android's openness distinguished it from iPhone for 17 years. Google is now requiring mandatory developer registration for all apps, including those distributed outside the Play Store. {url} #KeepAndroidOpen"
social_callout_x_3: "Deschiderea Android l-a deosebit de iPhone timp de 17 ani. Google impune acum înregistrarea obligatorie a dezvoltatorilor pentru toate aplicațiile, inclusiv cele distribuite în afara Play Store. {url} #KeepAndroidOpen"
# [en] social_callout_x_4: "F-Droid, the open-source Android app store, calls Google's developer verification an \"existential threat\" to alternative app distribution. The EFF warns it creates a pathway to censorship. {url} #KeepAndroidOpen"
social_callout_x_4: "F-Droid, magazinul de aplicații Android open-source, numește verificarea dezvoltatorilor Google o \"amenințare existențială\" pentru distribuția alternativă de aplicații. EFF avertizează că aceasta creează o cale spre cenzură. {url} #KeepAndroidOpen"
# [en] social_callout_x_5: "Google's proposed workaround for installing unverified apps requires 9 steps, a 24-hour wait, and runs through Play Services, which Google can modify at any time. It hasn't shipped in any beta. {url} #KeepAndroidOpen"
social_callout_x_5: "Soluția propusă de Google pentru instalarea aplicațiilor neverificate necesită 9 pași, o așteptare de 24 de ore și rulează prin Play Services, pe care Google le poate modifica oricând. Nu a fost lansată în nicio versiune beta. {url} #KeepAndroidOpen"
# social_callout_x_6: "Android was sold to us as an open platform. Now Google wants every developer to register and submit ID just to let you install their apps. Don't let them rug-pull 3 billion users. {url} @AlteredDeal #KeepAndroidOpen"
social_callout_x_6: "Android ne-a fost vândut ca o platformă deschisă. Acum Google vrea ca fiecare dezvoltator să se înregistreze și să furnizeze un act de identitate doar ca să-ți permită să le instalezi aplicațiile. Nu-i lăsa să înșele 3 miliarde de utilizatori. {url} @AlteredDeal #KeepAndroidOpen"
# social_callout_x_7: "If you bought your phone, you should own it. Google's new 'developer verification' means they decide what software you're allowed to run on your own property. Join the 100k+ signers opposing this: {url} #KeepAndroidOpen"
social_callout_x_7: "Dacă ți-ai cumpărat telefonul, ar trebui să-l deții cu adevărat. Noua \"verificare a dezvoltatorilor\" a Google înseamnă că ei decid ce software ai voie să rulezi pe propria ta proprietate. Alătură-te celor peste 100.000 de semnatari care se opun: {url} #KeepAndroidOpen"
# social_callout_x_8: "Google is turning Android into a walled garden. Mandatory ID, registration fees, and a 9-step 'advanced flow' for sideloading? That's not security, it's a monopoly move. {url} @AlteredDeal #KeepAndroidOpen"
social_callout_x_8: "Google transformă Android într-o \"grădină cu ziduri\". Act de identitate obligatoriu, taxe de înregistrare și un \"flux avansat\" de 9 pași pentru sideloading? Asta nu e securitate, e o mișcare de monopol. {url} @AlteredDeal #KeepAndroidOpen"
# social_callout_x_9: "What happens to the student's first app, or the privacy tool built by a volunteer? Google's mandatory registration blocks them all by default unless they play by Google's rules. {url} #KeepAndroidOpen"
social_callout_x_9: "Ce se întâmplă cu prima aplicație a unui student sau cu instrumentul de confidențialitate creat de un voluntar? Înregistrarea obligatorie a Google le blochează implicit pe toate, dacă nu respectă regulile Google. {url} #KeepAndroidOpen"
# social_callout_x_10: "17 years of Android openness are at risk. Google's plan to block unverified apps is a direct hit on F-Droid and independent software. Stop the lockdown: {url} @AlteredDeal #KeepAndroidOpen"
social_callout_x_10: "17 ani de deschidere Android sunt în pericol. Planul Google de a bloca aplicațiile neverificate lovește direct F-Droid și software-ul independent. Oprește blocarea: {url} @AlteredDeal #KeepAndroidOpen"
# [en] social_callout_linkedin_1: "Starting September 2026, Google will require every Android app developer to register centrally and provide government-issued identification before their software can be installed on any device. This applies to all apps, not just those on the Play Store. over 67 organizations have signed an open letter opposing the policy. {url} #KeepAndroidOpen"
social_callout_linkedin_1: "Începând din septembrie 2026, Google va impune ca fiecare dezvoltator de aplicații Android să se înregistreze central și să furnizeze un act de identitate emis de stat înainte ca software-ul său să poată fi instalat pe orice dispozitiv. Aceasta se aplică tuturor aplicațiilor, nu doar celor din Play Store. Peste 67 de organizații au semnat o scrisoare deschisă împotriva acestei politici. {url} #KeepAndroidOpen"
# [en] social_callout_linkedin_2: "Android's openness has been its distinguishing feature for nearly two decades. Google is now mandating developer registration for all Android apps, including those distributed through alternative stores like F-Droid. The EFF, FSF, Tor Project, and dozens of other organizations are raising serious concerns. {url} #KeepAndroidOpen"
social_callout_linkedin_2: "Deschiderea Android a fost caracteristica sa distinctivă timp de aproape două decenii. Google impune acum înregistrarea dezvoltatorilor pentru toate aplicațiile Android, inclusiv cele distribuite prin magazine alternative precum F-Droid. EFF, FSF, Tor Project și zeci de alte organizații ridică îngrijorări serioase. {url} #KeepAndroidOpen"
# [en] social_callout_linkedin_3: "Google's developer verification program would give a single company the technical ability to block any app, from any developer, on any certified Android device worldwide. This affects independent developers, open-source projects, and the principle that you control the software on hardware you own. {url} #KeepAndroidOpen"
social_callout_linkedin_3: "Programul de verificare a dezvoltatorilor al Google ar oferi unei singure companii capacitatea tehnică de a bloca orice aplicație, de la orice dezvoltator, pe orice dispozitiv Android certificat din lume. Aceasta afectează dezvoltatorii independenți, proiectele open-source și principiul conform căruia tu controlezi software-ul de pe hardware-ul pe care îl deții. {url} #KeepAndroidOpen"
# [en] social_callout_linkedin_4: "F-Droid estimates 85% of its open-source apps could face distribution issues under Google's new developer verification rules. The requirement for government ID and signing key evidence creates barriers for anonymous contributors, developers in sanctioned countries, and volunteer-maintained projects. {url} #KeepAndroidOpen"
social_callout_linkedin_4: "F-Droid estimează că 85% dintre aplicațiile sale open-source ar putea întâmpina probleme de distribuție conform noilor reguli de verificare a dezvoltatorilor Google. Cerința unui act de identitate emis de stat și a dovezii cheilor de semnare creează bariere pentru contribuitorii anonimi, dezvoltatorii din țări sancționate și proiectele întreținute de voluntari. {url} #KeepAndroidOpen"
# [en] social_callout_linkedin_5: "Google's proposed \"advanced flow\" for sideloading unverified apps requires 9 steps, a mandatory 24-hour waiting period, and runs entirely through Google Play Services. The community has been asked to accept a blog post as a functional safeguard. It has not appeared in any beta release. {url} #KeepAndroidOpen"
social_callout_linkedin_5: "\"Fluxul avansat\" propus de Google pentru sideloading-ul aplicațiilor neverificate necesită 9 pași, o perioadă obligatorie de așteptare de 24 de ore și rulează în întregime prin Google Play Services. Comunității i s-a cerut să accepte o postare de blog drept garanție funcțională. Nu a apărut în nicio versiune beta. {url} #KeepAndroidOpen"
# [en] social_callout_bluesky_1: "Starting September 2026, Google will block any Android app whose developer hasn't registered and provided government ID. This affects all apps, not just Play Store apps. F-Droid calls it an \"existential threat.\" @keepandroidopen.bsky.social #KeepAndroidOpen {url}"
social_callout_bluesky_1: "Începând din septembrie 2026, Google va bloca orice aplicație Android al cărei dezvoltator nu s-a înregistrat și nu a furnizat un act de identitate emis de stat. Aceasta afectează toate aplicațiile, nu doar cele din Play Store. F-Droid o numește o \"amenințare existențială\". @keepandroidopen.bsky.social #KeepAndroidOpen {url}"
